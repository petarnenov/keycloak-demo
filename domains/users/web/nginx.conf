# Per-domain nginx for the users domain. Twin of domains/trading/web/nginx.conf
# — see that file for the design notes. Only the port, server_name, cert
# filenames, upstream target, and /api/<domain>/ path differ.

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  client_max_body_size 8m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5186 ssl;
    http2 on;
    server_name users.geowealth.int;

    ssl_certificate     /certs/users.crt;
    ssl_certificate_key /certs/users.key;

    error_page 497 =301 https://$host:$server_port$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/users/ {
      set $upstream "bff-users:8080";
      rewrite ^/api/users/(.*)$ /api/$1 break;
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Authorization     $http_authorization;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
