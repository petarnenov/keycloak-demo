# Per-domain nginx. Single server block serves the built SPA over HTTPS and
# proxies /api/billing/* to the bff-billing compose service. The same listener
# catches plain-HTTP requests (the browser sends HTTP to an SSL port → nginx
# emits an internal 497 → error_page hands it a 301 to the https:// twin).

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Docker's embedded DNS. Tell nginx to use it so each /api/billing
  # request re-resolves bff-billing instead of caching its IP at boot. Without
  # this, recreating bff-billing leaves nginx talking to a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5184 ssl;
    http2 on;
    server_name billing.geowealth.int;

    ssl_certificate     /certs/billing.crt;
    ssl_certificate_key /certs/billing.key;

    # Plain HTTP that hit this SSL listener: nginx returns 400 internally with
    # code 497, error_page rewrites it into a 301 to the https:// URL.
    error_page 497 =301 https://$host:$server_port$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    # Vite's preview-time proxy rewrite ( /api/billing → /api ) lives here now.
    # Using a variable in proxy_pass forces nginx to re-resolve DNS via the
    # resolver above on every request.
    location /api/billing/ {
      set $upstream "bff-billing:8080";
      rewrite ^/api/billing/(.*)$ /api/$1 break;
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5184;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
    }

    # BFF / Token Handler endpoints (OIDC code flow, session, logout) — the BFF
    # owns the tokens; the browser only carries the httpOnly BSESSION cookie.
    # $http_host (with the :5184 port) + X-Forwarded-* let the BFF build the
    # redirect_uri Keycloak has registered. /oauth/* = login + callback,
    # /auth/* = /auth/me, /logout = RP-initiated logout.
    location ~ ^/(oauth|auth)/ {
      set $upstream "bff-billing:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5184;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
      # /auth/logout redirects to P1's IdP-initiated SLO at http://localhost:8888.
      # The default `proxy_redirect` rewrites that off-host Location to a path
      # that ends up relative to /auth/, so the browser tries to GET
      # /auth/8888/saml/... on the SPA origin. Turn that off — Location URLs
      # from the BFF are already correct for the browser.
      proxy_redirect     off;
    }
    location = /logout {
      set $upstream "bff-billing:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5184;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
    }

    # RAG AI-assistant widget BUNDLE. Instead of baking ai-assistant.js into this
    # image (which would force a billing rebuild on every widget change), proxy it
    # from the AI-assistant frontend container (nginx, published on the host at
    # :8800), which serves it at /ai-assistant.js with Cache-Control: no-cache.
    # The trailing slash on proxy_pass strips the /ai-assistant/ prefix, so
    # /ai-assistant/ai-assistant.js → :8800/ai-assistant.js (and the .map too).
    # Rebuild the widget = rebuild only the AI-assistant frontend; billing picks
    # up the new bundle on the next request, no billing rebuild needed.
    location /ai-assistant/ {
      proxy_pass         http://host.docker.internal:8800/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # RAG AI-assistant widget backend. The <ai-assistant> Web Component calls
    # /assistant/api/v1/* on this origin; strip the /assistant prefix and proxy
    # to the AI-assistant backend, which runs in a SEPARATE compose project and
    # is published on the host at :8801. host.docker.internal reaches the host
    # (added to /etc/hosts via the demo-billing extra_hosts mapping). Same-origin
    # so the browser sees HTTPS — no CORS, no mixed-content block.
    #
    # proxy_pass uses a literal host (no variable) so nginx resolves it once at
    # startup from /etc/hosts; buffering is off so the chat SSE stream flushes
    # token-by-token instead of being held back.
    location /assistant/ {
      rewrite ^/assistant/(.*)$ /$1 break;
      proxy_pass         http://host.docker.internal:8801;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   Connection        "";
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
    }

    # SPA fallback: any path that isn't a real file falls through to index.html
    # so React Router can take over.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
