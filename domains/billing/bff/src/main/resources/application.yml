micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:billing-bff}
  server:
    cors:
      enabled: true
      configurations:
        all:
          allowedOrigins:
            - ${CORS_ORIGIN:https://billing.geowealth.int:5184}
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders:
            - "*"
  http:
    services:
      p1authz:
        url: ${P1_AUTHZ_URL:http://localhost:8888}
        read-timeout: 2s
  security:
    enabled: true
    authentication: bearer
    token:
      name-key: preferred_username
      roles-name: roles
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080/realms/demo-realm}/protocol/openid-connect/certs
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /api/**
        access:
          - isAuthenticated()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:billing-bff}
  authz:
    # Tier 2/3 fine checks (p1-auth-flow.md §2.2/§2.9). Opt-in: off keeps the
    # coarse-only @Secured behaviour until P1's authz endpoints are reachable.
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
