micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:trading-bff}
  http:
    client:
      ssl:
        insecure-trust-all-certs: true
    services:
      p1authz:
        url: ${P1_AUTHZ_URL:http://localhost:8888}
        read-timeout: 2s
      # Keycloak token endpoint, used by TokenRefreshFilter for the
      # refresh_token grant (BFF / Token Handler keeps tokens fresh server-side).
      kc:
        url: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
        read-timeout: 5s
  session:
    http:
      cookie: true
      header: false
      cookie-name: TSESSION
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
  security:
    enabled: true
    # Backend-for-Frontend / Token Handler: the BFF holds the OAuth tokens in a
    # server-side session and hands the browser only an httpOnly session cookie.
    authentication: session
    endpoints:
      logout:
        get-allowed: true
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:demo-trading-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
      nonce:
        persistence: session
      state:
        persistence: session
    token:
      roles-name: roles
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/realms/demo-realm}/protocol/openid-connect/certs
    redirect:
      login-success: /
      # Silent-first SSO: bff-core's AuthController#loginFailed inspects the
      # session marker set by SilentLoginController and either upgrades to an
      # interactive login (when the silent attempt produced
      # `error=login_required`) or falls back to the SPA error page.
      login-failure: /auth/login-failed
      logout: /
      unauthorized:
        enabled: false
      forbidden:
        enabled: false
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /backchannel-logout
        http-method: POST
        access:
          - isAnonymous()
      # Silent-first SSO recovery hook — see bff-core SilentLoginController.
      - pattern: /auth/login-failed
        access:
          - isAnonymous()
      - pattern: /auth/me
        access:
          - isAuthenticated()
      - pattern: /api/**
        access:
          - isAuthenticated()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:trading-bff}
  # trading = a SHARED RESOURCE (like billing): access is decided by the CURRENT
  # logged-in user's fine permission, not firm membership. The gate checks
  # (object-type, permission) via Tier 2/3 (P1AuthzClient -> p1-authz-me.do).
  # Default = TRADE (5) + EXECUTE (5) ("can execute trades"). For a firm-bound
  # subdomain set type=firm + firm-cd instead. See person-identity-via-existing-linkdelink.md.
  requirement:
    type: ${APP_REQUIREMENT_TYPE:resource}
    firm-cd: ${APP_REQUIREMENT_FIRM_CD:}
    object-type: ${APP_REQUIREMENT_OBJECT_TYPE:5}
    permission: ${APP_REQUIREMENT_PERMISSION:5}
  authz:
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
  p1:
    # P1's IdP-initiated SLO endpoint — see billing's twin for the rationale.
    initiate-slo-url: http://localhost:8888/saml/idp/initiate-slo.do
