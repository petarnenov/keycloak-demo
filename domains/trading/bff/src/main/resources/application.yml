micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:trading-bff}
  http:
    client:
      ssl:
        insecure-trust-all-certs: true
    services:
      # authz-service: PolicyRuleClient calls /policy/* for the Tier-3 list refine.
      authz:
        url: ${AUTHZ_URL:http://localhost:8090}
        read-timeout: 2s
  # Forward-auth data BFF: auth-UNAWARE. nginx runs the auth_request against the
  # token-handler and injects X-Auth-* identity headers; this service trusts them
  # (HeaderIdentity) and never resolves a session. The Micronaut security filter
  # is off — /api is already gated upstream, and identity is header-borne.
  security:
    enabled: false

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:trading-bff}
  requirement:
    type: ${APP_REQUIREMENT_TYPE:resource}
    firm-cd: ${APP_REQUIREMENT_FIRM_CD:}
    object-type: ${APP_REQUIREMENT_OBJECT_TYPE:5}
    permission: ${APP_REQUIREMENT_PERMISSION:5}
  authz:
    # PolicyRule capability/refine fine checks — always on, matching P1
    # (PolicyRuleManager gates on nothing). gwAdmin still bypasses.
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
