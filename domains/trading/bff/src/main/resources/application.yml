micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:trading-bff}
  http:
    client:
      ssl:
        insecure-trust-all-certs: true
    services:
      p1authz:
        url: ${P1_AUTHZ_URL:http://localhost:8888}
        read-timeout: 2s
      # Keycloak token endpoint, used by TokenRefreshFilter for the
      # refresh_token grant (BFF / Token Handler keeps tokens fresh server-side).
      kc:
        url: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
        read-timeout: 5s
  session:
    http:
      cookie: true
      header: false
      cookie-name: TSESSION
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
  security:
    enabled: true
    # Backend-for-Frontend / Token Handler: the BFF holds the OAuth tokens in a
    # server-side session and hands the browser only an httpOnly session cookie.
    authentication: session
    endpoints:
      logout:
        get-allowed: true
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:demo-trading-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
      nonce:
        persistence: session
      state:
        persistence: session
    token:
      roles-name: roles
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/realms/demo-realm}/protocol/openid-connect/certs
    redirect:
      login-success: /
      login-failure: /?login_error=true
      logout: /
      unauthorized:
        enabled: false
      forbidden:
        enabled: false
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /backchannel-logout
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /auth/me
        access:
          - isAuthenticated()
      - pattern: /api/**
        access:
          - isAuthenticated()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:trading-bff}
  authz:
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
