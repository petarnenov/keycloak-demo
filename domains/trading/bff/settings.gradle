rootProject.name = 'trading-bff'

// Composite build: pull the shared BFF infra (demo.bff:bff-core) from the
// sibling source tree. Gradle substitutes the dependency declared in
// build.gradle.kts from this included build. At repo-split this line is
// replaced by a registry repository; the dependency coordinate stays the same.
includeBuild('../../../bff-core')
