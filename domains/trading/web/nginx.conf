# Per-domain nginx for the trading domain. Twin of domains/billing/web/nginx.conf
# — see that file for the design notes. Only the port, server_name, cert
# filenames, upstream target, and /api/<domain>/ path differ.

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Docker's embedded DNS — see domains/billing/web/nginx.conf for the why.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5185 ssl;
    http2 on;
    server_name trading.geowealth.int;

    ssl_certificate     /certs/trading.crt;
    ssl_certificate_key /certs/trading.key;

    error_page 497 =301 https://$host:$server_port$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    # Forward-auth: gate /api/trading on the Token Handler's /auth/verify; inject
    # the X-Auth-* identity it returns and DROP the session cookie — bff-trading
    # is auth-unaware. See billing's nginx.conf for the full rationale.
    location /api/trading/ {
      set $upstream "bff-trading:8080";

      auth_request               /th-verify;
      auth_request_set $auth_user  $upstream_http_x_auth_username;
      auth_request_set $auth_sub   $upstream_http_x_auth_sub;
      auth_request_set $auth_pid   $upstream_http_x_auth_person_id;
      auth_request_set $auth_firm  $upstream_http_x_auth_firm_cd;
      auth_request_set $auth_mem   $upstream_http_x_auth_memberships;
      auth_request_set $auth_roles $upstream_http_x_auth_roles;
      auth_request_set $auth_token $upstream_http_x_auth_access_token;

      rewrite ^/api/trading/(.*)$ /api/$1 break;
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5185;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            "";
      proxy_set_header   X-Auth-Username     $auth_user;
      proxy_set_header   X-Auth-Sub          $auth_sub;
      proxy_set_header   X-Auth-Person-Id    $auth_pid;
      proxy_set_header   X-Auth-Firm-Cd      $auth_firm;
      proxy_set_header   X-Auth-Memberships  $auth_mem;
      proxy_set_header   X-Auth-Roles        $auth_roles;
      proxy_set_header   X-Auth-Access-Token $auth_token;
    }

    location = /th-verify {
      internal;
      set $th "token-handler-trading:8080";
      proxy_pass                 http://$th/auth/verify;
      proxy_http_version         1.1;
      proxy_pass_request_body    off;
      proxy_set_header           Content-Length "";
      proxy_set_header           Host           $http_host;
      proxy_set_header           Cookie         $http_cookie;
      proxy_buffer_size          16k;
      proxy_buffers              4 16k;
    }

    # BFF / Token Handler endpoints (OIDC code flow, session, logout). $http_host
    # (with :5185) + X-Forwarded-* let the BFF build the registered redirect_uri.
    # Auth paths go to the extracted Token Handler (shares Redis + TSESSION +
    # demo-trading-client with bff-trading). See billing's nginx.conf for the why.
    location ~ ^/(oauth|auth)/ {
      set $upstream "token-handler-trading:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5185;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
      # /auth/logout redirects to P1's IdP-initiated SLO at http://localhost:8888;
      # see billing's nginx.conf for why this is necessary.
      proxy_redirect     off;
    }
    location = /logout {
      set $upstream "token-handler-trading:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5185;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
