# Per-domain nginx for the trading domain. Twin of domains/billing/web/nginx.conf
# — see that file for the design notes. Only the port, server_name, cert
# filenames, upstream target, and /api/<domain>/ path differ.

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  upstream trading_bff {
    server bff-trading:8080;
  }

  server {
    listen 5185 ssl;
    http2 on;
    server_name trading.geowealth.int;

    ssl_certificate     /certs/trading.crt;
    ssl_certificate_key /certs/trading.key;

    error_page 497 =301 https://$host:$server_port$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/trading/ {
      proxy_pass         http://trading_bff/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Authorization     $http_authorization;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
