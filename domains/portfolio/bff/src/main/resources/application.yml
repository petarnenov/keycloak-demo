# B2: shared session + sid store. Defaults to localhost for a bare `java -jar`
# run; compose injects REDIS_URI=redis://redis:6379.
redis:
  uri: ${REDIS_URI:redis://localhost:6379}
micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:portfolio-bff}
  http:
    client:
      # Server-side OIDC calls (discovery + token exchange) hit Keycloak at its
      # PUBLIC issuer URL (https://auth.geowealth.int:5180) so the `iss` claim
      # matches what the browser-side authorize redirect uses. The container
      # reaches that host via the `auth.geowealth.int:host-gateway` extra_host;
      # the cert is mkcert-signed, so trust it for this demo.
      ssl:
        insecure-trust-all-certs: true
    services:
      authz:
        url: ${AUTHZ_URL:http://localhost:8090}
        read-timeout: 2s
      # Keycloak token endpoint, used by TokenRefreshFilter for the
      # refresh_token grant (BFF / Token Handler keeps tokens fresh server-side).
      kc:
        url: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
        read-timeout: 5s
  session:
    http:
      cookie: true
      header: false
      cookie-name: PSESSION
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
      # B2: store sessions in Redis (not in-JVM) so any replica serves any
      # session and back-channel logout from one replica tears it down globally.
      redis:
        enabled: true
  security:
    enabled: true
    # Backend-for-Frontend / Token Handler: the BFF holds the OAuth tokens in a
    # server-side session and hands the browser only an httpOnly session cookie.
    authentication: session
    endpoints:
      logout:
        # POST-only (M1, logout-CSRF defence). The SPA signs out via a same-site
        # form POST to the custom /auth/logout (see AuthController + AuthProvider);
        # the built-in /logout is unused, so deny GET to close the CSRF vector a
        # cross-site top-level GET navigation would otherwise open.
        get-allowed: false
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:demo-portfolio-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
      # Nonce is a plain string and rides the (Redis-backed) server session.
      nonce:
        persistence: session
      # State persistence MUST be cookie, not session (B2). The `State` object is
      # neither @Introspected nor Serializable, so the Redis session store cannot
      # serialize it and login fails. A cookie keeps the value off the session;
      # the callback is same-site (auth + portfolio share the geowealth.int eTLD+1),
      # so the state cookie is sent on the KC→callback navigation.
      state:
        persistence: cookie
    token:
      roles-name: roles
      jwt:
        signatures:
          jwks:
            # Used only to verify the back-channel logout token KC posts to us
            # (server-to-server, internal URL).
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/realms/demo-realm}/protocol/openid-connect/certs
    redirect:
      login-success: /
      # Route OAuth callback failures through AuthController#loginFailed so the
      # silent-first flow can recognise an `error=login_required` outcome and
      # upgrade it to an interactive login instead of bouncing to the error
      # page. See bff-core SilentLoginController javadoc.
      login-failure: /auth/login-failed
      logout: /
      # Protected endpoints must answer 401/403 to the SPA's fetch (so it can
      # redirect the browser to /oauth/login/keycloak), NOT 302-redirect the
      # XHR itself.
      unauthorized:
        enabled: false
      forbidden:
        enabled: false
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /backchannel-logout
        http-method: POST
        access:
          - isAnonymous()
      # Silent-first SSO recovery hook — invoked by micronaut-security on
      # OAuth callback failure (e.g. error=login_required). Must be reachable
      # without auth so the redirect can fire even when there's no session.
      - pattern: /auth/login-failed
        access:
          - isAnonymous()
      - pattern: /auth/me
        access:
          - isAuthenticated()
      # Forward-auth: /api/** is gated by nginx (auth_request -> token-handler
      # /auth/verify). nginx forwards the request with X-Auth-* identity headers
      # and WITHOUT the session cookie, so it reaches this BFF anonymous — the
      # controller reads identity from the headers (HeaderIdentity). isAnonymous
      # here just means "don't 401 the already-gated request".
      - pattern: /api/**
        access:
          - isAnonymous()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:portfolio-bff}
  # What this subdomain requires of a federated person (subdomain-agnostic SSO;
  # see person-identity-via-existing-linkdelink.md). portfolio = a SHARED RESOURCE:
  # access is decided by the CURRENT logged-in user's fine permission, not by
  # firm membership. The gate checks (object-type, permission) via PolicyRule capability/refine
  # (PolicyRuleClient -> authz-service /policy/capabilities). Default = PORTFOLIO_CENTER (59) + EXECUTE (5).
  # For a firm-bound subdomain set type=firm + firm-cd instead (see trading).
  requirement:
    type: ${APP_REQUIREMENT_TYPE:resource}
    firm-cd: ${APP_REQUIREMENT_FIRM_CD:}
    object-type: ${APP_REQUIREMENT_OBJECT_TYPE:59}
    permission: ${APP_REQUIREMENT_PERMISSION:5}
  p1:
    # P1's IdP-initiated SLO endpoint. /auth/logout redirects the browser here;
    # P1 invalidates its HttpSession + emits a signed SAML LogoutRequest to KC,
    # which ends the KC SSO session and lands the user on P1's login form.
    # Override at deploy time via the APP_P1_INITIATE_SLO_URL env var — Micronaut
    # binds it to this property automatically (a ${...:default} placeholder can't
    # be used here: Micronaut mis-parses the colons in an http://host:port default).
    initiate-slo-url: http://localhost:8888/saml/idp/initiate-slo.do
  authz:
    # PolicyRule capability/refine fine checks (p1-auth-flow.md §2.2/§2.9). Opt-in: off keeps the
    # coarse-only @Secured behaviour until P1's authz endpoints are reachable.
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
