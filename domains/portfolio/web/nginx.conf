# Per-domain nginx. Single server block serves the built SPA over HTTPS and
# proxies /api/portfolio/* to the bff-portfolio compose service. The same listener
# catches plain-HTTP requests (the browser sends HTTP to an SSL port → nginx
# emits an internal 497 → error_page hands it a 301 to the https:// twin).

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Docker's embedded DNS. Tell nginx to use it so each /api/portfolio
  # request re-resolves bff-portfolio instead of caching its IP at boot. Without
  # this, recreating bff-portfolio leaves nginx talking to a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5186 ssl;
    http2 on;
    server_name portfolio.geowealth.int;

    ssl_certificate     /certs/portfolio.crt;
    ssl_certificate_key /certs/portfolio.key;

    # Plain HTTP that hit this SSL listener: nginx returns 400 internally with
    # code 497, error_page rewrites it into a 301 to the https:// URL.
    error_page 497 =301 https://$host:$server_port$request_uri;

    root  /usr/share/nginx/html;
    index index.html;

    # Vite's preview-time proxy rewrite ( /api/portfolio → /api ) lives here now.
    # Using a variable in proxy_pass forces nginx to re-resolve DNS via the
    # resolver above on every request.
    # Forward-auth: gate every /api/portfolio request on the Token Handler's
    # /auth/verify (industry-standard nginx auth_request). The token-handler
    # validates+refreshes the session and returns the identity as X-Auth-*
    # response headers; we copy them onto the upstream request and DO NOT forward
    # the session cookie — so bff-portfolio is fully auth-unaware (no session, no
    # token refresh; it reads identity from the headers).
    location /api/portfolio/ {
      set $upstream "bff-portfolio:8080";

      auth_request               /th-verify;
      auth_request_set $auth_user  $upstream_http_x_auth_username;
      auth_request_set $auth_sub   $upstream_http_x_auth_sub;
      auth_request_set $auth_pid   $upstream_http_x_auth_person_id;
      auth_request_set $auth_firm  $upstream_http_x_auth_firm_cd;
      auth_request_set $auth_mem   $upstream_http_x_auth_memberships;
      auth_request_set $auth_roles $upstream_http_x_auth_roles;
      auth_request_set $auth_token $upstream_http_x_auth_access_token;

      rewrite ^/api/portfolio/(.*)$ /api/$1 break;
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5186;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      # No session cookie to the data BFF — identity travels as trusted headers.
      proxy_set_header   Cookie            "";
      proxy_set_header   X-Auth-Username     $auth_user;
      proxy_set_header   X-Auth-Sub          $auth_sub;
      proxy_set_header   X-Auth-Person-Id    $auth_pid;
      proxy_set_header   X-Auth-Firm-Cd      $auth_firm;
      proxy_set_header   X-Auth-Memberships  $auth_mem;
      proxy_set_header   X-Auth-Roles        $auth_roles;
      proxy_set_header   X-Auth-Access-Token $auth_token;
    }

    # Internal subrequest target for auth_request above. Forwards the session
    # cookie to the Token Handler's /auth/verify; the access-token header it
    # returns is ~1-2 KB, so widen the buffers that hold subrequest response headers.
    location = /th-verify {
      internal;
      set $th "token-handler:8080";
      proxy_pass                 http://$th/auth/verify;
      proxy_http_version         1.1;
      proxy_pass_request_body    off;
      proxy_set_header           Content-Length "";
      proxy_set_header           Host           $http_host;
      # The single multi-tenant Token Handler resolves the per-domain requirement
      # by host — forward THIS domain's host so it picks portfolio's gate.
      proxy_set_header           X-Forwarded-Host $http_host;
      proxy_set_header           Cookie         $http_cookie;
      proxy_buffer_size          16k;
      proxy_buffers              4 16k;
    }

    # BFF / Token Handler endpoints (OIDC code flow, session, logout) — the BFF
    # owns the tokens; the browser only carries the httpOnly PSESSION cookie.
    # $http_host (with the :5186 port) + X-Forwarded-* let the BFF build the
    # redirect_uri Keycloak has registered. /oauth/* = login + callback,
    # /auth/* = /auth/me, /logout = RP-initiated logout.
    # Auth paths go to the extracted Token Handler (not the data BFF). It shares
    # Redis + the PSESSION cookie + demo-portfolio-client with bff-portfolio, so the
    # session it writes is read by bff-portfolio for /api authz. A shared-auth fix
    # redeploys token-handler-portfolio only — this web image + bff-portfolio untouched.
    location ~ ^/(oauth|auth)/ {
      set $upstream "token-handler:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5186;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
      # /auth/logout redirects to P1's IdP-initiated SLO at http://localhost:8888.
      # The default `proxy_redirect` rewrites that off-host Location to a path
      # that ends up relative to /auth/, so the browser tries to GET
      # /auth/8888/saml/... on the SPA origin. Turn that off — Location URLs
      # from the Token Handler are already correct for the browser.
      proxy_redirect     off;
    }
    location = /logout {
      set $upstream "token-handler:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $http_host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  5186;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   Cookie            $http_cookie;
    }

    # SPA fallback: any path that isn't a real file falls through to index.html
    # so React Router can take over.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
