apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minimal AUTH-TIER overlay for the in-cluster smoke (minikube): just the
# Token Handler + its config/secret + shared Redis. The data BFFs and Ingress
# need the EXTERNAL Keycloak + P1 to do anything, so they are left out — this
# overlay only proves the auth tier schedules, the pod reaches Ready (/health),
# the ConfigMap-driven tenant map mounts, and the HPA is created.
#
# It cherry-picks individual base files (not the whole base), so build it with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/minikube-auth-tier
#   kubectl apply     --load-restrictor LoadRestrictionsNone -k k8s/overlays/minikube-auth-tier
namespace: geowealth-demo

resources:
  - ../../base/namespace.yaml
  - ../../base/redis.yaml
  - ../../base/token-handler-config.yaml
  - ../../base/token-handler.yaml

patches:
  - target:
      kind: Deployment
      name: token-handler
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: HorizontalPodAutoscaler
      name: token-handler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
