apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# THE WHOLE SYSTEM in-cluster: data (Oracle+seed, ES, kc-postgres, redis) +
# identity (Keycloak, token-handler, BFFs, web) + legacy P1 (Tomcat + Akka
# agents). Build with --load-restrictor LoadRestrictionsNone (cherry-picks
# base files + reads keycloak/realm-export.json). k8s/up.sh drives the ordered
# bring-up; this is the declarative whole.
#
# Memcached retired: P1's Hibernate L2 cache defaults to EHCACHE, never
# wires to memcached at runtime (curr_items=0 across days of traffic).
# Redis already backs HttpSession + kc_sub index + token-handler sessions;
# any future distributed-cache need lands on Redisson (region factory
# stub already in HibernateSessionFactory.java). Two cache backends for
# zero hits was dead weight.
namespace: geowealth-demo

resources:
  - ../../base/namespace.yaml
  # data tier — oracle.yaml is the BAKED seeded image (no separate seed Job)
  - ../../base/oracle.yaml
  - ../../base/elasticsearch.yaml
  - ../../base/kc-postgres.yaml
  - ../../base/redis.yaml
  # identity tier
  - ../../base/keycloak.yaml
  - ../../base/user-service.yaml
  - ../../base/token-handler-config.yaml
  - ../../base/token-handler.yaml
  - ../../base/data-bff-config.yaml
  - ../../base/bff-billing.yaml
  - ../../base/bff-trading.yaml
  - ../../base/web.yaml
  - ../../base/web-portfolio.yaml
  - ../../base/bff-portfolio.yaml
  # legacy P1 tier
  - ../../base/p1.yaml
  # routing (app model: web pods self-proxy; KC + P1 hosts)
  - ../../base/ingress-app.yaml

# Keycloak realm seed from the canonical export (32 KB).
configMapGenerator:
  - name: keycloak-realm
    files:
      - ../../../keycloak/realm-export.json
  # P1 URLs from the per-environment config file (swap to urls.prod.env for prod).
  # p1-tomcat consumes this ConfigMap via envFrom (see base/p1.yaml).
  - name: p1-urls
    envs:
      - ../../../../geowealth/k8s/env/urls.dev.env
  # The mkcert development CA. The token-handler does the OIDC code flow against
  # Keycloak's PUBLIC mkcert-signed issuer (https://auth.geowealth.int), so it
  # must trust this CA; its entrypoint imports the mounted file into the JVM
  # truststore. Dev-only — prod uses a real CA already in the system trust store,
  # so this generator + the volume patch below live in the dev overlay, not base.
  - name: mkcert-ca
    files:
      - ../../../proxy/certs/mkcert-rootCA.pem
  # The SINGLE per-env URL source (k8s/env/urls.<env>.env). Its [APP] keys feed
  # the token-handler env below via configMapKeyRef; its [REALM] keys drive
  # scripts/reconcile-realm.sh (the realm side). Swap to urls.qa/prod.env to
  # retarget. The extra [REALM] keys land in this ConfigMap harmlessly (the app
  # only reads the four it references).
  - name: app-urls
    envs:
      - ../../../k8s/env/urls.dev.env
generatorOptions:
  disableNameSuffixHash: true

images:
  - { name: keycloak-demo-token-handler, newTag: latest }
  - { name: keycloak-demo-user-service, newTag: latest }
  - { name: keycloak-demo-keycloak, newTag: latest }
  - { name: keycloak-demo-billing-bff, newTag: latest }
  - { name: keycloak-demo-trading-bff, newTag: latest }
  - { name: keycloak-demo-billing-web, newTag: latest }
  - { name: keycloak-demo-trading-web, newTag: latest }
  - { name: keycloak-demo-geowealth, newTag: latest }
  - { name: keycloak-demo-db, newTag: seeded }

patches:
  # Disable the legacy "Service link" auto env injection for all P1 workloads.
  # K8s synthesises env vars like ORACLE_PORT=tcp://<svcIP>:<port> for every
  # ClusterIP Service that exists when a pod starts; that collides head-on with
  # the P1 entrypoint, which reads ORACLE_PORT as the JDBC port and produces a
  # malformed URL: jdbc:oracle:thin:@//oracle:tcp://10.x.x.x:1521/<pdb>.
  # The bug only fires when the oracle Service is ClusterIP at pod-start time
  # (ExternalName Services don't get the synthesised env vars), so flipping the
  # data-tier env to an IP-based external sprang the trap on the agents that
  # restarted after the swap.
  - target: { labelSelector: "app.kubernetes.io/component=legacy" }
    patch: |-
      - op: add
        path: /spec/template/spec/enableServiceLinks
        value: false
  - target: { kind: Deployment, name: token-handler }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # One replica is enough for the dev stack. The old self-deadlock (logout
      # blocked the request thread waiting on KC, which synchronously
      # back-channel-POSTed this same handler → /health starved → liveness kill →
      # 502) is gone now that AuthController fires the KC end-session on a
      # background thread (see bff-core AuthController#logout), so a single
      # replica serves both the logout request and the self-directed
      # back-channel POST without deadlocking.
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: token-handler }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  - target: { kind: Deployment, name: user-service }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      # Dev: start with a single user-service replica; the HPA scales to 3 on demand.
      - { op: replace, path: /spec/replicas, value: 1 }
  - target: { kind: HorizontalPodAutoscaler, name: user-service }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 1 }
      - { op: replace, path: /spec/maxReplicas, value: 3 }
  # p1-tomcat: dev overlay runs a single replica. The OIDC RP login flow
  # parks state + PKCE verifier in HttpSession; the SSO round-trip can
  # complete in under 100 ms — faster than the Redisson-Tomcat session
  # write becomes visible on a peer pod. Service.spec.sessionAffinity
  # already pins by ClientIP, but `kubectl port-forward` collapses every
  # request to one pod IP regardless, so a second replica would funnel
  # all dev traffic to the same pod anyway. One replica avoids both the
  # race window and the wasted pod.
  - target: { kind: HorizontalPodAutoscaler, name: p1-tomcat }
    patch: |
      - { op: replace, path: /spec/minReplicas, value: 2 }
      - { op: replace, path: /spec/maxReplicas, value: 5 }
  # Token-handler URLs come from the single per-env source k8s/env/urls.dev.env
  # (the app-urls ConfigMap above), NOT hardcoded here — change the env file to
  # retarget. valueFrom/configMapKeyRef (rather than envFrom) so these override
  # the base's explicit env entries by name. The four keys:
  #   KEYCLOAK_ISSUER          browser-facing KC, MUST carry :5180 (kc-ext Service)
  #                            — discovery + authorize redirect + `iss`.
  #   KEYCLOAK_AUTH_SERVER_URL in-cluster KC for JWKS (http://keycloak:8080).
  #   P1_AUTHZ_URL             in-cluster P1 for server-side authz (p1-tomcat:8080).
  #   APP_P1_INITIATE_SLO_URL  browser-facing P1 SLO the /auth/logout 303 targets.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: token-handler }
      spec:
        template:
          spec:
            containers:
              - name: token-handler
                imagePullPolicy: IfNotPresent
                env:
                  # `value: null` deletes the base's literal value so only
                  # valueFrom remains (k8s rejects an env var carrying both).
                  - name: KEYCLOAK_ISSUER
                    value: null
                    valueFrom: { configMapKeyRef: { name: app-urls, key: KEYCLOAK_ISSUER } }
                  - name: KEYCLOAK_AUTH_SERVER_URL
                    value: null
                    valueFrom: { configMapKeyRef: { name: app-urls, key: KEYCLOAK_AUTH_SERVER_URL } }
                  - name: P1_AUTHZ_URL
                    value: null
                    valueFrom: { configMapKeyRef: { name: app-urls, key: P1_AUTHZ_URL } }
                  - name: APP_P1_INITIATE_SLO_URL
                    valueFrom: { configMapKeyRef: { name: app-urls, key: APP_P1_INITIATE_SLO_URL } }
                  # Dev-safe logout fallback: with no id_token to hint KC, land the
                  # user on their own SPA origin instead of the P1 SLO URL — P1 is
                  # scaled to 0 in FE-only dev so the SLO target refuses. Prod
                  # overlays omit this (default false) → keep the P1 single-logout.
                  - name: APP_P1_FALLBACK_TO_SPA
                    value: "true"
                # Mount the mkcert dev CA so the entrypoint can import it into the
                # JVM truststore (see token-handler/Dockerfile). The image runs
                # non-root with a read-only rootfs (base securityContext), so it
                # imports into a copy on the writable /tmp emptyDir — no root or
                # writable rootfs needed. Strategic-merge adds this alongside the
                # base tenants/tmp mounts.
                volumeMounts:
                  - name: mkcert-ca
                    mountPath: /certs/mkcert-rootCA.pem
                    subPath: mkcert-rootCA.pem
                    readOnly: true
            volumes:
              - name: mkcert-ca
                configMap: { name: mkcert-ca }
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: bff-billing }
      spec:
        template:
          spec:
            containers:
              - name: bff-billing
                imagePullPolicy: IfNotPresent
                env:
                  - { name: KEYCLOAK_ISSUER, value: "https://auth.geowealth.int/realms/demo-realm" }
                  - { name: KEYCLOAK_AUTH_SERVER_URL, value: "http://keycloak:8080/realms/demo-realm" }
                  - { name: P1_AUTHZ_URL, value: "http://p1-tomcat:8080" }
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: bff-trading }
      spec:
        template:
          spec:
            containers:
              - name: bff-trading
                imagePullPolicy: IfNotPresent
                env:
                  - { name: KEYCLOAK_ISSUER, value: "https://auth.geowealth.int/realms/demo-realm" }
                  - { name: KEYCLOAK_AUTH_SERVER_URL, value: "http://keycloak:8080/realms/demo-realm" }
                  - { name: P1_AUTHZ_URL, value: "http://p1-tomcat:8080" }
