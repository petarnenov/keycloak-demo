# authz-service — read-only Oracle DAO answering the PolicyRule decision
# questions (/policy/capabilities|can|refine). The demo's PolicyRuleManager as a
# standalone identity-tier service (alignment plan Phase A0): it removes P1 from
# the runtime authz path — the token-handler and data BFFs reach it as
# authz-service:8080 instead of calling P1's p1-authz-*.do.
# Stateless; scales independently (per-request data-path traffic). Oracle wiring
# mirrors user-service (in-cluster Service DNS or ExternalName via up.sh's
# data-tier toggle). The caller's Keycloak access token is validated against the
# realm JWKS (in-cluster keycloak:8080) — signature/expiry only, open audience.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-service
  labels:
    app.kubernetes.io/name: authz-service
    app.kubernetes.io/component: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: authz-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authz-service
        app.kubernetes.io/component: identity
    spec:
      # Disable K8s Service link env injection (ORACLE_PORT=tcp://... collides
      # with the JDBC_URL substitution — same trap as user-service).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: authz-service
          image: keycloak-demo-authz-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oracle-config
            - secretRef:
                name: oracle-creds
                optional: true
          env:
            - name: ORACLE_HOST
              value: oracle
            - name: ORACLE_PORT
              value: "1521"
            - name: JDBC_URL
              value: "jdbc:oracle:thin:@//oracle:1521/$(ORACLE_PDB)"
            # Validate the caller's token against the realm JWKS. In-cluster KC
            # http endpoint (same signing keys as the public issuer).
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak:8080/realms/demo-realm/protocol/openid-connect/certs"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authz-service
  labels:
    app.kubernetes.io/name: authz-service
spec:
  selector:
    app.kubernetes.io/name: authz-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# HPA: the authz decision path scales with per-request /api traffic,
# independently of user-service (per-login) and the auth login path.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: authz-service
  labels:
    app.kubernetes.io/name: authz-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authz-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
