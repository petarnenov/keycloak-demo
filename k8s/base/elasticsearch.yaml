# Elasticsearch 7.17.x — matches geowealth's ES client jars (db/stack uses 7.17.28).
# Single-node, security off (demo). Prod = ECK operator + TLS + dedicated roles.
# The React client/account DIRECTORIES are ES-backed; after the DB seed run the
# es-reindex Job (RefreshClientSearcherTool) — see p1 tier. Login/detail/policy
# SQL work without it.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
spec:
  selector: { app.kubernetes.io/name: elasticsearch }
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: data
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: elasticsearch }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: data
    spec:
      initContainers:
        # ES needs vm.max_map_count >= 262144; set it on the node (privileged).
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext: { privileged: true }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
          ports:
            - { name: http, containerPort: 9200 }
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
            - { name: ingest.geoip.downloader.enabled, value: "false" }
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
