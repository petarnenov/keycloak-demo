# Oracle Database Free 23ai — the GP application schema, IN-CLUSTER.
#
# Uses the BAKED image `keycloak-demo-db:seeded` (built from db/Dockerfile):
# schema + Flyway seeds (V1..VN + R__local_login_hash) are pre-loaded into
# datafiles at IMAGE BUILD time. A fresh pod runs restore-oradata.sh once to
# seed the empty PVC from the image's `/opt/oracle/baked-oradata` snapshot
# (~30-60s; one-time cost per PVC) and then Oracle opens the already-
# initialized DB (~10s). Compare to the previous gvenzl-base + init-scripts
# + Flyway-Job flow which took ~10-15 min on every fresh up.sh.
#
# Trade-off: SYS/APP creds and the gitignored login hash are baked into the
# image. up.sh builds INTO minikube's docker daemon via docker-env so the
# image never leaves the cluster. For a real prod pipeline split the build:
# bake schema-only here, then a tiny Job applies R__ from a Secret.
apiVersion: v1
kind: Service
metadata:
  name: oracle
  labels: { app.kubernetes.io/name: oracle }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: oracle }
  ports:
    - { name: tns, port: 1521, targetPort: 1521 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  labels:
    app.kubernetes.io/name: oracle
    app.kubernetes.io/component: data
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: oracle }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oracle
        app.kubernetes.io/component: data
    spec:
      containers:
        - name: oracle
          image: keycloak-demo-db:seeded
          imagePullPolicy: IfNotPresent
          ports:
            - { name: tns, containerPort: 1521 }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
          # First pod on a fresh PVC: restore-oradata.sh runs before the gvenzl
          # entrypoint and copies ~3-4 GB of baked datafiles into the volume
          # (~30-60s). Keep the budget wide enough for that one-time copy.
          # On a populated PVC (pod restart): Oracle reopens the DB in ~10s.
          startupProbe:
            exec: { command: ["healthcheck.sh"] }
            periodSeconds: 10
            failureThreshold: 18   # ~3 min, covers the one-time restore + open
          readinessProbe:
            exec: { command: ["healthcheck.sh"] }
            periodSeconds: 15
          volumeMounts:
            - { name: data, mountPath: /opt/oracle/oradata }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
