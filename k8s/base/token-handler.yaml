# The MULTI-TENANT Token Handler — ONE Deployment fronting EVERY domain. Scales on
# total auth traffic (HPA below), not one JVM per domain. The Ingress external-auth
# annotations point /api/<name> here (/auth/verify forward-auth); /(oauth|auth)/ +
# /logout route here directly. It owns all session/login/logout/token-refresh; the
# data BFFs are auth-unaware.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-handler
  labels:
    app.kubernetes.io/name: token-handler
    app.kubernetes.io/component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: token-handler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-handler
        app.kubernetes.io/component: auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # Spread replicas across nodes so a node loss never takes out all of auth.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: token-handler
      containers:
        - name: token-handler
          image: keycloak-demo-token-handler:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # `redis://:<password>@host:port` — Lettuce / Redisson URI
            # form. Password is sourced from a Secret and substituted by
            # the shell so the literal never lands in the manifest /
            # ConfigMap. Requires `command: ["/bin/sh", "-c"]` style entry
            # — Micronaut reads `REDIS_URI` from env on boot. Since the
            # default container entrypoint is `java -jar ...`, we ALSO
            # mount the password as `REDIS_PASSWORD` and rely on the BFF
            # to do `redis://:${REDIS_PASSWORD}@redis:6379` via Micronaut's
            # placeholder resolution in application.yml. Simpler path:
            # pre-built URI from the Secret value.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URI
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: SESSION_COOKIE_NAME
              value: "GWSESSION"
            - name: OAUTH_CLIENT_ID
              value: "demo-shared-client"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: token-handler-oidc
                  key: client-secret
            # Keycloak + P1 are EXTERNAL to the cluster (managed / their own
            # release / the P1 host). Overlays set the real URLs.
            - name: KEYCLOAK_ISSUER
              value: "https://auth.geowealth.int/realms/demo-realm"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "https://auth.geowealth.int/realms/demo-realm"
            - name: AUTHZ_URL
              value: "http://authz-service:8080"
            # No kc_idp_hint (Phase 5): the realm has no p1 SAML IdP, users come
            # from the User Storage SPI, and KC renders its own geowealth login
            # form. Forcing kc_idp_hint=p1 would broker login (incl. the silent
            # prompt=none probe) into a dead SAML flow if a p1 IdP ever reappears,
            # landing the user on a login splash instead of a silent SSO. Empty =
            # IdpHintFilter skips the append and only does the prompt=none rewrite.
            - name: APP_KC_IDP_HINT
              value: ""
            # P1's BrandingApiServlet (bearer-token-gated /branding-api/keycloak/
            # whitelabel/*). BrandResolver uses it as the source of truth for
            # the SPA brand; falls back to the inline app.brands config when
            # the token is blank (offline dev path).
            - name: BRANDING_API_BASE_URL
              value: "http://p1-tomcat:8080"
            - name: POC_BRANDING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: token-handler-branding
                  key: token
            # Merge the mounted tenant map over the baked application.yml.
            - name: MICRONAUT_CONFIG_FILES
              value: "/config/tenants.yml"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            # The DEBUG-log firehose that used to slow /health is fixed at the
            # root now (bff-core ships a logback.xml pinning root=INFO and
            # silencing io.lettuce). These generous values remain as
            # defence-in-depth so a transient GC pause under peak e2e load can't
            # SIGKILL the pod mid-request (exit 137) and cascade auth failures:
            # 10s per probe, 5 consecutive failures (~75s) before a restart.
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: tenants
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tenants
          configMap:
            name: token-handler-tenants
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: token-handler
  labels:
    app.kubernetes.io/name: token-handler
spec:
  selector:
    app.kubernetes.io/name: token-handler
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: token-handler
  labels:
    app.kubernetes.io/name: token-handler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: token-handler
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: token-handler
  labels:
    app.kubernetes.io/name: token-handler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: token-handler
