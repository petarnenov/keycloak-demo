# Billing DATA BFF — auth-unaware. It reads identity from the X-Auth-* headers the
# Ingress external-auth (token-handler /auth/verify) injects; it holds no session,
# runs no token refresh, no security filters. Only the Tier-3 list `refine` (its
# own data rows) calls P1. Scales on billing's data traffic, independent of auth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff-billing
  labels:
    app.kubernetes.io/name: bff-billing
    app.kubernetes.io/component: data
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bff-billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff-billing
        app.kubernetes.io/component: data
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bff-billing
          image: keycloak-demo-billing-bff:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: REDIS_URI
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: OAUTH_CLIENT_ID
              value: "demo-billing-client"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: data-bff-oidc
                  key: billing-client-secret
            - name: KEYCLOAK_ISSUER
              value: "https://auth.geowealth.int/realms/demo-realm"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "https://auth.geowealth.int/realms/demo-realm"
            - name: P1_AUTHZ_URL
              value: "https://p1.geowealth.int"
            - name: AUTHZ_FINE_ENABLED
              value: "true"
            - name: APP_REQUIREMENT_TYPE
              value: "resource"
            - name: APP_REQUIREMENT_OBJECT_TYPE
              value: "59"
            - name: APP_REQUIREMENT_PERMISSION
              value: "5"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bff-billing
  labels:
    app.kubernetes.io/name: bff-billing
spec:
  selector:
    app.kubernetes.io/name: bff-billing
  ports:
    - name: http
      port: 8080
      targetPort: http
