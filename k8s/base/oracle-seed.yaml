# oracle-seed — the remote half of `db/stack make provision`: records the V1
# baseline (loaded server-side by the Oracle init scripts) and applies the seed
# migrations V2..V18 + the gitignored login hash. Idempotent (flyway skips applied
# versions; baseline is guarded). Run after the Oracle pod is Ready.
apiVersion: v1
kind: Secret
metadata:
  name: db-login-hash
  labels: { app.kubernetes.io/name: oracle }
type: Opaque
stringData:
  # PLACEHOLDER. The real login-password hash lives in the gitignored
  # db/local/R__local_login_hash.sql (it is a credential). k8s/up.sh overwrites
  # this Secret from that file when present; without it the schema still seeds but
  # no user can log in (mirrors `make local-hash`'s warn-and-continue).
  R__local_login_hash.sql: "-- no local login hash provided; set LDAP_PSWD_HASH via db/local/\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oracle-seed
  labels:
    app.kubernetes.io/name: oracle-seed
    app.kubernetes.io/component: data
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/name: oracle-seed }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-oracle
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z oracle 1521; do echo waiting for oracle:1521; sleep 5; done"]
      containers:
        - name: flyway
          image: keycloak-demo-db-seed:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: FW_URL
              value: "jdbc:oracle:thin:@//oracle:1521/FREEPDB1"
            - name: APP_PW
              valueFrom: { secretKeyRef: { name: oracle-creds, key: app-password } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              FW="flyway -url=$FW_URL -user=GP -password=$APP_PW -connectRetries=30"
              echo ">>> flyway info (before)"; $FW info || true
              # baselineOnMigrate: on a non-empty schema with no history table (the
              # Oracle init scripts loaded V1's 1792 tables + dropped the history
              # table), flyway creates the history, records V1 as the baseline, then
              # migrates V2..V18. Idempotent + no separate baseline step (which would
              # choke on an empty history table left by a retry).
              echo ">>> baseline-on-migrate V1, then V2..V18 (+ repeatable login hash)"
              $FW -baselineOnMigrate=true -baselineVersion=1 \
                  -baselineDescription=baseline_schema \
                  -locations=filesystem:/flyway/sql,filesystem:/flyway/local migrate
              echo ">>> flyway info (after)"; $FW info
          volumeMounts:
            - { name: login-hash, mountPath: /flyway/local }
      volumes:
        - name: login-hash
          secret:
            secretName: db-login-hash
