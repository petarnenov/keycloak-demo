# Bundle of dev-common agent roles — provides AuthorizationManager,
# AuthenticationManager, GeowealthPolicyRuleManager, entitypropertymanager,
# policyrules, DistributedCacheControllerManager, cacheagents, custodianagents,
# billingagents, portalagents, PortalManager, PortletManager, BillingManager,
# BillingSpecificationManager (see etc/devcommonagents.conf). Required because
# HomepageAction calls AuthorizationManager via Mailer.sendAnyMessageToLocalActorAndWait
# — without this agent, the call hangs for ServiceTimeoutException and the
# react/indexReact.do entry page never renders for the user post-SAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-devcommonagents
  labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-devcommonagents } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: devcommonagents }
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx1536m" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: ES_HOST, value: elasticsearch }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat }
spec:
  selector: { app.kubernetes.io/name: p1-tomcat }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
spec:
  serviceName: p1-tomcat
  replicas: 1                       # in-memory HttpSession; sticky at ingress (demo)
  selector: { matchLabels: { app.kubernetes.io/name: p1-tomcat } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
    spec:
      initContainers:
        - name: wait-saml
          image: busybox:1.36
          command: ["sh","-c","until nc -z p1-samlmanager 4007 2>/dev/null || true; do sleep 5; break; done"]
      containers:
        - name: tomcat
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          # ALL P1 URLs (KC authorize/token/admin, P1 base/callback, SAML keystore
          # path/pass/entity, the OIDC client/hint, the host allowlist) come from
          # the per-environment ConfigMap `p1-urls`, generated from
          # geowealth/k8s/env/urls.<env>.env. Retarget an env = swap the env file,
          # no code change / no image rebuild.
          envFrom:
            - { configMapRef: { name: p1-urls } }
            - { configMapRef: { name: oracle-config, optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: tomcat }
            - { name: JAVA_OPTS_EXTRA, value: "-Xms1g -Xmx4g" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: ES_HOST, value: elasticsearch }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: "2",  memory: 5Gi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            - { name: keystore, mountPath: /etc/p1, readOnly: true }
      volumes:
        - name: keystore
          secret: { secretName: p1-saml-keystore }
