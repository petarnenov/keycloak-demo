# searchagents — provides SearchManager, ClientSearchManager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-searchagents
  labels: { app.kubernetes.io/name: p1-searchagents, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-searchagents } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-searchagents, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: searchagents }
            # ClientSearchManager runs Hibernate loaders over CLIENT/ACCOUNT-heavy
            # tables to drive the CRM directory ("households", "clients" pages).
            # 1G heap fits the baked PDB but OOMs inside the actor message handler
            # against a real populated Oracle — JVM stays Running 0 restarts (Akka
            # swallows the failure), but the reply never returns and the SPA hangs
            # on a loading spinner (ExecuteClientSearchRequestDirectoryMsg dead
            # letters in p1-tomcat). Same shape as the devcommonagents OOM above.
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx4G" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            # Sized for the 4G JVM heap above; container limit must exceed heap.
            requests: { cpu: 100m, memory: 2Gi }
            limits:   { cpu: 500m, memory: 5Gi }
---
