# P1 (geowealth) legacy tier — the Tomcat webapp + the Akka agents, all from the
# ONE `keycloak-demo-geowealth` image (built from geowealth/k8s/Dockerfile),
# selected by ROLE/AGENT env. Mirrors nfstart + commandspecs/*.spec.
#
#   p1-coordinator   StatefulSet  Akka SEED node (stable DNS :4007)
#   p1-samlmanager   Deployment   samlintegrationmanager — REQUIRED for SAML login
#   p1-reportengine | p1-proposalagents | p1-emailagent  — whitelabel Save flow
#   p1-tomcat        Deployment   the webapp; HttpSession in Redis (Redisson
#                                 Tomcat session manager) → non-sticky LB OK
#
# Common backing services via Service DNS: oracle, elasticsearch, redis.
# BLUEPRINT — depends on the geowealth image build (see geowealth/k8s/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: p1-saml-keystore
  labels: { app.kubernetes.io/name: p1 }
type: Opaque
stringData:
  # PLACEHOLDER — k8s/up.sh loads the real PKCS#12 from the dev keystore
  # (/tmp/p1-idp-dev.p12); its public cert must match the realm `p1` IdP
  # signingCertificate. Prod = External Secrets/Vault + cert-manager.
  idp.p12: "REPLACE_WITH_p1-idp-dev.p12"
---
apiVersion: v1
kind: Service
metadata:
  name: p1-coordinator
  labels: { app.kubernetes.io/name: p1-coordinator }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: p1-coordinator }
  ports:
    - { name: akka, port: 4007, targetPort: 4007 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p1-coordinator
  labels: { app.kubernetes.io/name: p1-coordinator, app.kubernetes.io/component: legacy }
spec:
  serviceName: p1-coordinator
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-coordinator } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-coordinator, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          # JDBC SERVICE_NAME / user / password come from oracle-config + oracle-creds
          # (built from k8s/env/data-tier.<env>.env in up.sh). Both optional: when
          # absent, P1's entrypoint falls back to its in-cluster defaults
          # (FREEPDB1 / gp / gp123) so the dev path needs no Secret.
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env: &p1env
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
            # The seed node's self-address MUST equal the seed-nodes literal.
            - { name: AKKA_CANONICAL, value: "p1-coordinator-0.p1-coordinator" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 2Gi }
      initContainers:
        - name: wait-oracle
          image: busybox:1.36
          command: ["sh","-c","until nc -z oracle 1521; do sleep 5; done"]
---
# Agent template applied to samlmanager + the whitelabel agents (same image,
# different ROLE/AGENT/heap). They join the coordinator's cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-samlmanager
  labels: { app.kubernetes.io/name: p1-samlmanager, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-samlmanager } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-samlmanager, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: samlintegrationmanager }
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx2G" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 2.5Gi }
          volumeMounts:
            - { name: keystore, mountPath: /etc/p1, readOnly: true }
      volumes:
        - name: keystore
          secret: { secretName: p1-saml-keystore }
---
