---
apiVersion: v1
kind: Service
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat }
spec:
  selector: { app.kubernetes.io/name: p1-tomcat }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
  # OIDC RP login flow puts the state + PKCE verifier in HttpSession and
  # expects the callback to land on the same Tomcat that started the flow.
  # Sessions are mirrored in Redis (RedissonSessionManager), but the
  # write-after-set / read-from-Redis path has a sub-100 ms eventual
  # consistency window — the KC SSO round-trip can return faster than the
  # state attribute is visible on a peer pod, surfacing as
  # `OIDC_CALLBACK_STATE_MISMATCH` and a blank 403. Sticky-by-ClientIP
  # routes the whole flow at one pod so the in-JVM session is always
  # authoritative. Falls back to even-distribution after the
  # timeoutSeconds idle window. Note: ingress-nginx already preserves the
  # client IP; `kubectl port-forward` pins to one pod regardless.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
spec:
  # Phase 7: horizontal scale enabled. Tomcat HttpSession is externalized to
  # Redis (Phase 6 Redisson session manager), so any replica serves any
  # session — sticky-session affinity is no longer required at the ingress.
  # HPA at the bottom of this file scales 2..5 replicas on cpu=70%.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector: { matchLabels: { app.kubernetes.io/name: p1-tomcat } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
    spec:
      initContainers:
        - name: wait-saml
          image: busybox:1.36
          command: ["sh","-c","until nc -z p1-samlmanager 4007 2>/dev/null || true; do sleep 5; break; done"]
      containers:
        - name: tomcat
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          # ALL P1 URLs (KC authorize/token/admin, P1 base/callback, SAML keystore
          # path/pass/entity, the OIDC client/hint, the host allowlist) come from
          # the per-environment ConfigMap `p1-urls`, generated from
          # geowealth/k8s/env/urls.<env>.env. Retarget an env = swap the env file,
          # no code change / no image rebuild.
          envFrom:
            - { configMapRef: { name: p1-urls } }
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: tomcat }
            # -Xss8m: deep User/LoggedUser object graphs (Hibernate associations
            # walked by RedissonSessionManager via Kryo) overflow the default
            # 512K JVM thread stack on OidcCallbackAction.populateSession write
            # to Redis; bumping the stack lets the serializer recurse through
            # the existing graph without changing the codec.
            - { name: JAVA_OPTS_EXTRA, value: "-Xms1g -Xmx4g -Xss8m" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - { name: REDIS_PORT, value: "6379" }
            # Phase 6: Redisson Tomcat session manager points at the same Redis.
            # The yaml template renders REDIS_HOST:REDIS_PORT into the config.
            - { name: REDIS_URI, value: "redis://redis:6379" }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
            # Phase 5: P1 OIDC RP configuration. Browser issuer is the public KC
            # URL the SPA reaches; server issuer is the in-cluster Service DNS
            # the Tomcat → KC token exchange uses (avoids a TLS hop and the
            # mkcert trust dance). p1-client + secret are seeded in
            # realm-export.json and re-asserted by scripts/reconcile-realm.sh.
            - { name: P1_OIDC_BROWSER_ISSUER, value: "https://auth.geowealth.int:5180/realms/demo-realm" }
            - { name: P1_OIDC_SERVER_ISSUER, value: "http://keycloak:8080/realms/demo-realm" }
            # Dev: shorten the KcSessionProbe interval so cross-host global logout
            # tears down sibling tabs within the e2e window (prod default 30s).
            - { name: P1_KC_PROBE_INTERVAL_MS, value: "5000" }
            - { name: P1_OIDC_CLIENT_ID, value: "p1-client" }
            - { name: P1_OIDC_CLIENT_SECRET, value: "p1-dev-secret" }
            - { name: P1_OIDC_REDIRECT_URI, value: "http://localhost:8080/oidc/callback.do" }
            - { name: P1_OIDC_POST_LOGIN_URL, value: "http://localhost:8080/" }
            - { name: P1_OIDC_POST_LOGOUT_URL, value: "http://localhost:8080/" }
            - { name: P1_OIDC_JWKS_URL, value: "http://keycloak:8080/realms/demo-realm/protocol/openid-connect/certs" }
            - { name: P1_OIDC_EXPECTED_ISSUER, value: "https://auth.geowealth.int:5180/realms/demo-realm" }
            # Bearer token gating BrandingApiAuthFilter. The token-handler
            # carries the same secret (token-handler-branding) and presents
            # `Authorization: Bearer <token>` on every /branding-api/* request.
            # Missing/blank → P1 rejects all branding traffic with 401.
            - name: POC_BRANDING_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: token-handler-branding
                  key: token
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: "2",  memory: 5Gi }
          # External Oracle (k8s/env/data-tier.dev.env) adds round-trip latency
          # that pushes Tomcat's `/` response past the default 1s probe timeout,
          # which kills supposedly-Ready pods in a loop. 5s tolerates the slow
          # path without masking a real hang.
          startupProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          volumeMounts:
            - { name: keystore, mountPath: /etc/p1, readOnly: true }
      volumes:
        - name: keystore
          # Phase 5 retired the SAML keystore; Secret may be a placeholder or
          # absent. `optional: true` keeps the Pod schedulable either way.
          secret: { secretName: p1-saml-keystore, optional: true }
---
# Phase 7: HorizontalPodAutoscaler — scale p1-tomcat on CPU.
# Min 2 (chaos-test: deleting one pod doesn't drop capacity to zero),
# max 5 (demo cluster headroom).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: p1-tomcat
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
