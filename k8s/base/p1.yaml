# Bundle of dev-common agent roles — provides AuthorizationManager,
# AuthenticationManager, GeowealthPolicyRuleManager, entitypropertymanager,
# policyrules, DistributedCacheControllerManager, cacheagents, custodianagents,
# billingagents, portalagents, PortalManager, PortletManager, BillingManager,
# BillingSpecificationManager (see etc/devcommonagents.conf). Required because
# HomepageAction calls AuthorizationManager via Mailer.sendAnyMessageToLocalActorAndWait
# — without this agent, the call hangs for ServiceTimeoutException and the
# react/indexReact.do entry page never renders for the user post-SAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-devcommonagents
  labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-devcommonagents } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: devcommonagents }
            # CrntCostBasisLoader pre-loads the entire CostBasisAccount table into an
            # in-memory cache at boot. 1.5G fits the tiny baked PDB; against a populated
            # external Oracle (e.g. 192.168.1.42/ORCL12VM) the load OOMs and the agent
            # CrashLoopBackOffs, killing AuthorizationManager and stalling p1-tomcat
            # requests (IdentifyFirmByUrlMsg dead-letters). External mode also hits
            # JVM SIGSEGV in native frames at boot (ojdbc8 23.2 + huge result sets),
            # even with -Xint; 10G + G1GC is the best workaround tried, but boots
            # are still flaky. In-cluster baked Oracle is the stable path.
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx10G -XX:+UseG1GC" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            # Sized for the 10G JVM heap above; container limit must be > heap or
            # kubelet OOMKills before the JVM can throw OutOfMemoryError.
            requests: { cpu: 200m, memory: 2Gi }
            limits:   { cpu: "1",  memory: 12Gi }
---
# CRM agent bundle — hosts CrmManagerTrait (alias=CRM), DocumentVaultManagerTrait,
# CrmPortletManagerTrait, WhitelabelResourceManagerTrait (see etc/crm.xml).
# Required for every CRM-driven page: clientDirectory.do, accountDirectory.do,
# portfolioDirectory.do, household/client/account detail. CrmManager.executeClientSearchRequestDirectory
# does providerSendAndWait(ExecuteClientSearchRequestDirectoryMsg) to /user/CRM
# via DistributedPubSub; without this Deployment the message dead-letters and
# the action hangs until MESSAGE_TIMEOUT. ClientSearcher / ES lookups themselves
# run inside this trait — searchagents only owns SearchManager/ClientSearchManager
# auxiliaries, NOT the CRM directory entrypoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-crm
  labels: { app.kubernetes.io/name: p1-crm, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-crm } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-crm, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: crm }
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx2g" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 2.5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat }
spec:
  selector: { app.kubernetes.io/name: p1-tomcat }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p1-tomcat
  labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
spec:
  serviceName: p1-tomcat
  replicas: 1                       # in-memory HttpSession; sticky at ingress (demo)
  selector: { matchLabels: { app.kubernetes.io/name: p1-tomcat } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-tomcat, app.kubernetes.io/component: legacy }
    spec:
      initContainers:
        - name: wait-saml
          image: busybox:1.36
          command: ["sh","-c","until nc -z p1-samlmanager 4007 2>/dev/null || true; do sleep 5; break; done"]
      containers:
        - name: tomcat
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          # ALL P1 URLs (KC authorize/token/admin, P1 base/callback, SAML keystore
          # path/pass/entity, the OIDC client/hint, the host allowlist) come from
          # the per-environment ConfigMap `p1-urls`, generated from
          # geowealth/k8s/env/urls.<env>.env. Retarget an env = swap the env file,
          # no code change / no image rebuild.
          envFrom:
            - { configMapRef: { name: p1-urls } }
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: tomcat }
            - { name: JAVA_OPTS_EXTRA, value: "-Xms1g -Xmx4g" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:   { cpu: "2",  memory: 5Gi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          volumeMounts:
            - { name: keystore, mountPath: /etc/p1, readOnly: true }
      volumes:
        - name: keystore
          secret: { secretName: p1-saml-keystore }
---
# billingprocessagent — BillingProcessManager (number=3). Runs the instrumented
# BillingProcess.setTiersAndAmountForBilling that emits the explainability trace
# (min/max/discount + capital-flow/group/new-account proration). Heavier heap than the
# 1g bundles: billing loads accounts/positions/market values per run. The trace capture
# is turned ON here via -DbillingTraceEnabled=true (FirmBillingProcess.BILLING_TRACE_ENABLED);
# NOTE a GEO_VARIABLE 'billingTraceEnabled', if present, overrides this system property.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-billingprocessagent
  labels: { app.kubernetes.io/name: p1-billingprocessagent, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-billingprocessagent } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-billingprocessagent, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: billingprocessagent }
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx2560m -DbillingTraceEnabled=true" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - { name: MEMCACHED_HOST, value: memcached }
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:   { cpu: "1",  memory: 3Gi }
