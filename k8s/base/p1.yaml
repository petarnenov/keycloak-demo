# Bundle of dev-common agent roles — provides AuthorizationManager,
# AuthenticationManager, GeowealthPolicyRuleManager, entitypropertymanager,
# policyrules, DistributedCacheControllerManager, cacheagents, custodianagents,
# billingagents, portalagents, PortalManager, PortletManager, BillingManager,
# BillingSpecificationManager (see etc/devcommonagents.conf). Required because
# HomepageAction calls AuthorizationManager via Mailer.sendAnyMessageToLocalActorAndWait
# — without this agent, the call hangs for ServiceTimeoutException and the
# react/indexReact.do entry page never renders for the user post-SAML.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-devcommonagents
  labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: p1-devcommonagents } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: p1-devcommonagents, app.kubernetes.io/component: legacy }
    spec:
      containers:
        - name: agent
          image: keycloak-demo-geowealth:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - { configMapRef: { name: oracle-config, optional: true } }
            - { configMapRef: { name: es-config,     optional: true } }
            - { secretRef:    { name: oracle-creds,  optional: true } }
          env:
            - { name: ROLE, value: agent }
            - { name: AGENT, value: devcommonagents }
            # CrntCostBasisLoader pre-loads the entire CostBasisAccount table into an
            # in-memory cache at boot. 1.5G fits the tiny baked PDB; against a populated
            # external Oracle (e.g. 192.168.1.42/ORCL12VM) the load OOMs and the agent
            # CrashLoopBackOffs, killing AuthorizationManager and stalling p1-tomcat
            # requests (IdentifyFirmByUrlMsg dead-letters). External mode also hits
            # JVM SIGSEGV in native frames at boot (ojdbc8 23.2 + huge result sets),
            # even with -Xint; 10G + G1GC is the best workaround tried, but boots
            # are still flaky. In-cluster baked Oracle is the stable path.
            - { name: JAVA_OPTS_EXTRA, value: "-Xmx10G -XX:+UseG1GC" }
            - { name: POD_IP, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: ORACLE_HOST, value: oracle }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - { name: AKKA_SEED, value: "akka://DevPetar@p1-coordinator-0.p1-coordinator:4007" }
          resources:
            # Sized for the 10G JVM heap above; container limit must be > heap or
            # kubelet OOMKills before the JVM can throw OutOfMemoryError.
            requests: { cpu: 200m, memory: 2Gi }
            limits:   { cpu: "1",  memory: 12Gi }
---
# CRM agent bundle — hosts CrmManagerTrait (alias=CRM), DocumentVaultManagerTrait,
# CrmPortletManagerTrait, WhitelabelResourceManagerTrait (see etc/crm.xml).
# Required for every CRM-driven page: clientDirectory.do, accountDirectory.do,
# portfolioDirectory.do, household/client/account detail. CrmManager.executeClientSearchRequestDirectory
# does providerSendAndWait(ExecuteClientSearchRequestDirectoryMsg) to /user/CRM
