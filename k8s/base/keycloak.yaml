# Keycloak — in-cluster, backed by kc-postgres, realm seeded via --import-realm
# from the keycloak-realm ConfigMap (generated from keycloak/realm-export.json,
# 32 KB, fits). KC_HOSTNAME is the BROWSER-FACING issuer so `iss` matches the
# authorize URL; the Token Handler/BFFs fetch JWKS in-cluster at http://keycloak:8080.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  labels: { app.kubernetes.io/name: keycloak }
type: Opaque
stringData:
  username: "admin"
  password: "admin"        # PLACEHOLDER — prod via secret manager
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: { app.kubernetes.io/name: keycloak }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
# TLS-terminating proxy for the browser-facing issuer URL inside the cluster.
# token-handler's OpenID discovery + token exchange hits
# https://auth.geowealth.int:5180/... (the issuer KC emits in `iss`); via
# the up.sh-patched hostAlias `auth.geowealth.int → kc-ext.ClusterIP` that
# resolves to this Service. A plain Service that proxied to keycloak:8080
# couldn't satisfy an HTTPS handshake — so the Service selects a tiny nginx
# pod (kc-ext Deployment below) that terminates TLS on :5180 with the mkcert
# `auth-tls` cert and forwards to keycloak:8080 over plain HTTP.
apiVersion: v1
kind: Service
metadata:
  name: kc-ext
  labels: { app.kubernetes.io/name: kc-ext }
spec:
  selector: { app.kubernetes.io/name: kc-ext }
  ports:
    - { name: https, port: 5180, targetPort: 5180 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kc-ext-nginx
  labels: { app.kubernetes.io/name: kc-ext }
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 1024; }
    http {
      server_tokens off;
      server {
        listen 5180 ssl;
        http2 on;
        server_name auth.geowealth.int;
        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        location / {
          proxy_pass         http://keycloak.geowealth-demo.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_set_header   Host              $host;
          proxy_set_header   X-Forwarded-Proto https;
          proxy_set_header   X-Forwarded-Host  $host;
          proxy_set_header   X-Forwarded-Port  5180;
          proxy_set_header   X-Forwarded-For   $remote_addr;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-ext
  labels: { app.kubernetes.io/name: kc-ext, app.kubernetes.io/component: identity }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kc-ext } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kc-ext, app.kubernetes.io/component: identity }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5180, name: https }]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            - { name: tls,        mountPath: /certs, readOnly: true }
          resources:
            requests: { cpu: 10m,  memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: kc-ext-nginx }
        - name: tls
          secret: { secretName: auth-tls }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kc-postgres 5432; do echo waiting kc-postgres; sleep 3; done"]
      containers:
        - name: keycloak
          # Custom KC image — stock 26.0.7 + bundled provider JARs
          # (user-storage-spi, email-otp-authenticator, geowealth-theme).
          # See Dockerfile.keycloak at repo root.
          image: keycloak-demo-keycloak:latest
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm", "--optimized=false"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://kc-postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: kc-postgres, key: username } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: kc-postgres, key: password } } }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } } }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            # Browser-facing issuer — MUST include the browser-facing port (:5180
            # in dev, where the ingress is reached via port-forward 5180→443).
            # KC emits this verbatim as the issuer + every endpoint URL in the
            # discovery document, so the SPA and token-handler follow redirects
            # back through the same port the browser used. Overlays set per-env.
            - { name: KC_HOSTNAME, value: "https://auth.geowealth.int:5180" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9000 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /health/started, port: mgmt }
            periodSeconds: 10
            failureThreshold: 30      # KC boot + realm import is slow
          readinessProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 10
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
