# Keycloak — in-cluster, backed by kc-postgres, realm seeded via --import-realm
# from the keycloak-realm ConfigMap (generated from keycloak/realm-export.json,
# 32 KB, fits). KC_HOSTNAME is the BROWSER-FACING issuer so `iss` matches the
# authorize URL; the Token Handler/BFFs fetch JWKS in-cluster at http://keycloak:8080.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  labels: { app.kubernetes.io/name: keycloak }
type: Opaque
stringData:
  username: "admin"
  password: "admin"        # PLACEHOLDER — prod via secret manager
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: { app.kubernetes.io/name: keycloak }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kc-postgres 5432; do echo waiting kc-postgres; sleep 3; done"]
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args: ["start", "--import-realm", "--optimized=false"]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://kc-postgres:5432/keycloak" }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: kc-postgres, key: username } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: kc-postgres, key: password } } }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } } }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } } }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: "xforwarded" }
            # Browser-facing issuer — the ingress host. Overlays set the real value.
            - { name: KC_HOSTNAME, value: "https://auth.geowealth.int" }
            - { name: KC_HOSTNAME_STRICT, value: "false" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: mgmt, containerPort: 9000 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          startupProbe:
            httpGet: { path: /health/started, port: mgmt }
            periodSeconds: 10
            failureThreshold: 30      # KC boot + realm import is slow
          readinessProbe:
            httpGet: { path: /health/ready, port: mgmt }
            periodSeconds: 10
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
