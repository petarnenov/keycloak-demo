apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The multi-tenant Token Handler auth tier + data BFFs + shared Redis + Ingress.
# Keycloak and P1 are EXTERNAL (managed / their own release / the P1 host).
namespace: geowealth-demo

labels:
  - pairs:
      app.kubernetes.io/part-of: geowealth-demo
    includeSelectors: false

resources:
  - namespace.yaml
  - redis.yaml
  - redis-alerts.yaml
  - user-service.yaml
  - authz-service.yaml
  - token-handler-config.yaml
  - token-handler.yaml
  - data-bff-config.yaml
  - bff-billing.yaml
  - bff-trading.yaml
  - ingress.yaml
