# Postgres for Keycloak (KC's own store — separate from the Oracle GP app DB).
apiVersion: v1
kind: Secret
metadata:
  name: kc-postgres
  labels: { app.kubernetes.io/name: kc-postgres }
type: Opaque
stringData:
  # PLACEHOLDER — prod injects via a secret manager.
  username: "keycloak"
  password: "keycloak"
  database: "keycloak"
---
apiVersion: v1
kind: Service
metadata:
  name: kc-postgres
  labels: { app.kubernetes.io/name: kc-postgres }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: kc-postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kc-postgres
  labels:
    app.kubernetes.io/name: kc-postgres
    app.kubernetes.io/component: data
spec:
  serviceName: kc-postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kc-postgres }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kc-postgres
        app.kubernetes.io/component: data
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: kc-postgres, key: username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: kc-postgres, key: password } } }
            - { name: POSTGRES_DB,       valueFrom: { secretKeyRef: { name: kc-postgres, key: database } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
