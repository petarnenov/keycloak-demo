# memcached — hibernate L2 cache target for P1 (db/stack uses memcached:1.6, host
# literal "memcached":11211). Stateless.
apiVersion: v1
kind: Service
metadata:
  name: memcached
  labels: { app.kubernetes.io/name: memcached }
spec:
  selector: { app.kubernetes.io/name: memcached }
  ports:
    - { name: memcached, port: 11211, targetPort: 11211 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: memcached }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/component: cache
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 11211 }
      containers:
        - name: memcached
          image: memcached:1.6-alpine
          args: ["-m", "256"]
          ports:
            - { name: memcached, containerPort: 11211 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 320Mi }
          readinessProbe:
            tcpSocket: { port: memcached }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
