# Auth-domain reverse proxy. Same shape as domains/<x>/web/nginx.conf:
# TLS termination (mkcert pair), HTTP→HTTPS 301 via error_page 497,
# everything else forwarded to keycloak:8080 inside the docker network.
#
# In production this whole container would be replaced by an ingress
# controller / managed LB pointed at the same keycloak Service; the dev-time
# equivalent gives us the same wire shape (sso.example.com:443 →
# keycloak:8080) on a laptop.

worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Re-resolve upstream per request via docker's embedded DNS — see
  # domains/billing/web/nginx.conf for the rationale.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 5180 ssl;
    http2 on;
    server_name auth.geowealth.int;

    ssl_certificate     /certs/auth.crt;
    ssl_certificate_key /certs/auth.key;

    # Plain HTTP that hit this SSL listener → 301 to the https:// twin.
    error_page 497 =301 https://$host:$server_port$request_uri;

    # Keycloak emits internal links (redirects, token issuer URLs) based on
    # the X-Forwarded-* headers we send, plus its own KC_HOSTNAME setting.
    # The combination has to agree or the broker callback URLs end up
    # malformed.
    location / {
      set $upstream "keycloak:8080";
      proxy_pass         http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Host  $http_host;
      proxy_set_header   X-Forwarded-Port  $server_port;
      proxy_buffering    off;
    }
  }
}
