parent=keycloak.v2
import=common/keycloak
styles=css/theme.css

# Phase 14: theme now ships its own template.ftl that dynamically
# consumes ${brand} attributes injected by GeoWealthLoginFormsProvider
# (firmShortName, address line, footerText, asset data URIs, css
# variables). When the brand attribute is absent  e.g. when the realm
# is not opted into geowealthBrandingProvider  the template falls
# through to the upstream keycloak.v2 layout + the theme.css static
# defaults, so this is backward-compatible with the pre-Phase 14
# behaviour.
