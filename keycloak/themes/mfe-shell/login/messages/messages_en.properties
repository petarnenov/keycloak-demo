# Override Keycloak's default login page strings to match P1 (geowealth)
# wording. Keys come from
# upstream keycloak/themes/base/login/messages/messages_en.properties.
# P1 reference for the error catalog:
#   LoginAction.LOGIN_ERROR_MESSAGE_TEMPLATE
#   LoginAction.LOGIN_ERROR_MFA_EMAIL_REQUIRED
#   LoginStatus.toString() constants ("Invalid Attempt", "Locked Out",
#   "Too Many Tries", "Inactivated", "Service Failure", "Invalid MFA passcode",
#   "MFA Passcode has expired")
# When P1 surfaces a different wording for the same situation, use P1's.
# When P1 has no corresponding state (Keycloak-only flow, e.g. account
# linking confirmation), keep the upstream message verbatim.

# --- titles + button labels ---
loginAccountTitle=Sign in
loginTitle=Sign in
doLogIn=Login
doForgotPassword=Forgot Password?
doSignInWith=Sign in with
identity-provider-login-label=
# --- placeholders mirror P1: lowercase one-word hints. The login.ftl
#     override renders them via the placeholder attribute, not as
#     visible labels. ---
usernameOrEmail=username
password=password

# --- P1 surfaces all login errors with the same "trouble logging in"
#     contact line (per LoginAction.LOGIN_ERROR_MESSAGE_TEMPLATE +
#     ssoError.jsp). The firm email is rendered server-side in P1; on
#     the Keycloak side we hardcode the demo firm address since the
#     firm can't be resolved before authentication completes. The
#     demo-realm geowealthBrandingProvider opt-in could supply this
#     dynamically per host  follow-up if multi-tenant theming is
#     needed at the error surface. ---
invalidUserMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com
invalidUsernameMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com
invalidUsernameOrEmailMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com
invalidPasswordMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com

# --- session / timeout: P1 collapses to the same "trouble logging in" line ---
expiredCodeMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com
expiredActionMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com

# --- account-state errors (P1's LoginStatus surface) ---
accountDisabledMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com
accountTemporarilyDisabledMessage=If you''re having trouble logging in, please contact us at information@frontierwealth.com

# --- missing fields ---
missingUsernameMessage=Please enter your username.
missingPasswordMessage=Please enter your password.

# --- MFA / OTP (P1 wording: "Invalid passcode, please re-enter.") ---
invalidTotpMessage=Invalid passcode, please re-enter.
totpInvalidCodeError=Invalid passcode, please re-enter.
