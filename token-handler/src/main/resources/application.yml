# Token Handler — the shared OIDC/session/logout/token-refresh service, extracted
# from the domain BFFs so an auth fix redeploys THIS alone (domain data apps
# untouched). It is pure bff-core.
#
# MULTI-TENANT: ONE instance fronts EVERY demo domain. It uses ONE shared OIDC
# client (demo-shared-client; redirect_uri derived per-host from the proxied
# request) and ONE session cookie name (GWSESSION) — cookies are host-scoped, so
# billing.geowealth.int and trading.geowealth.int get distinct cookies even with
# the same name. Per-domain authorization is resolved by the request Host from the
# `app.tenants.*` map below (see SubdomainAuthorizer / SubdomainRequirements).
# Adding a domain = one `app.tenants.<slug>` entry + its host on the shared client,
# NOT a new Deployment. The data BFFs stay auth-unaware (forward-auth headers).
redis:
  uri: ${REDIS_URI:redis://localhost:6379}
micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:token-handler}
  http:
    client:
      ssl:
        # mkcert-signed KC cert in dev (B3 — prod removes this and trusts a real CA).
        insecure-trust-all-certs: true
    services:
      p1authz:
        url: ${P1_AUTHZ_URL:http://localhost:8888}
        read-timeout: 2s
      kc:
        url: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
        read-timeout: 5s
  session:
    http:
      cookie: true
      header: false
      # ONE cookie name for every domain — host-scoped, so each host gets its own.
      cookie-name: ${SESSION_COOKIE_NAME:GWSESSION}
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
      redis:
        enabled: true
  security:
    enabled: true
    authentication: session
    endpoints:
      logout:
        get-allowed: false
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:demo-shared-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
      nonce:
        persistence: session
      state:
        persistence: cookie
    token:
      roles-name: roles
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/realms/demo-realm}/protocol/openid-connect/certs
    redirect:
      login-success: /
      login-failure: /auth/login-failed
      logout: /
      unauthorized:
        enabled: false
      forbidden:
        enabled: false
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /backchannel-logout
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /auth/login-failed
        access:
          - isAnonymous()
      - pattern: /auth/th-version
        access:
          - isAnonymous()
      - pattern: /auth/me
        access:
          - isAuthenticated()
      - pattern: /auth/verify
        access:
          - isAuthenticated()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:token-handler}
  # MULTI-TENANT requirement map: host -> per-domain gate, resolved by the request
  # Host in /auth/verify (SubdomainAuthorizer + SubdomainRequirements). nginx
  # forwards the original client host as X-Forwarded-Host on the auth_request
  # subrequest. Adding a domain = one entry here (+ its host on demo-shared-client).
  # In K8s this block is supplied by a mounted ConfigMap, so adding a domain is a
  # config edit + rolling restart — no image rebuild, no data-BFF redeploy.
  tenants:
    billing:
      host: billing.geowealth.int
      type: resource          # shared resource → Tier-2 P1 permission gate
      object-type: 59         # BILLING_CENTER
      permission: 5           # EXECUTE
    trading:
      host: trading.geowealth.int
      type: resource
      object-type: 5          # TRADE
      permission: 5           # EXECUTE
  # Single-tenant fallback (per-domain build): inert while app.tenants is set, so
  # the bean stays empty here (no type → SubdomainAuthorizer uses the host map).
  p1:
    initiate-slo-url: http://localhost:8888/saml/idp/initiate-slo.do
  authz:
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
