# Token Handler — the shared OIDC/session/logout/token-refresh service, extracted
# from the domain BFFs so an auth fix redeploys THIS alone (domain data apps
# untouched). It is pure bff-core.
#
# MULTI-TENANT: ONE instance fronts EVERY demo domain. It uses ONE shared OIDC
# client (demo-shared-client; redirect_uri derived per-host from the proxied
# request) and ONE session cookie name (GWSESSION) — cookies are host-scoped, so
# billing.geowealth.int and trading.geowealth.int get distinct cookies even with
# the same name. Per-domain authorization is resolved by the request Host from the
# `app.tenants.*` map below (see SubdomainAuthorizer / SubdomainRequirements).
# Adding a domain = one `app.tenants.<slug>` entry + its host on the shared client,
# NOT a new Deployment. The data BFFs stay auth-unaware (forward-auth headers).
redis:
  uri: ${REDIS_URI:redis://localhost:6379}
micronaut:
  application:
    name: ${MICRONAUT_APPLICATION_NAME:token-handler}
  http:
    client:
      ssl:
        # mkcert-signed KC cert in dev (B3 — prod removes this and trusts a real CA).
        insecure-trust-all-certs: true
    services:
      authz:
        url: ${AUTHZ_URL:http://localhost:8090}
        read-timeout: 2s
      kc:
        url: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
        read-timeout: 5s
      branding:
        # P1's BrandingApiServlet is mounted at /branding-api/keycloak/whitelabel/*.
        # The BrandingApiClient prepends /branding-api/keycloak/whitelabel paths
        # at call time, so this value is the bare P1 base URL (no context path).
        url: ${BRANDING_API_BASE_URL:http://p1-tomcat:8080}
        read-timeout: 5s
  session:
    http:
      cookie: true
      header: false
      # ONE cookie name for every domain — host-scoped, so each host gets its own.
      cookie-name: ${SESSION_COOKIE_NAME:GWSESSION}
      cookie-path: /
      cookie-secure: true
      cookie-same-site: Lax
      redis:
        enabled: true
  security:
    enabled: true
    authentication: session
    endpoints:
      logout:
        get-allowed: false
    oauth2:
      clients:
        keycloak:
          client-id: ${OAUTH_CLIENT_ID:demo-shared-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${KEYCLOAK_ISSUER:https://auth.geowealth.int:5180/realms/demo-realm}
      nonce:
        persistence: session
      state:
        persistence: cookie
    token:
      roles-name: roles
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/realms/demo-realm}/protocol/openid-connect/certs
    redirect:
      login-success: /
      login-failure: /auth/login-failed
      logout: /
      unauthorized:
        enabled: false
      forbidden:
        enabled: false
    intercept-url-map:
      - pattern: /**
        http-method: OPTIONS
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /oauth/**
        access:
          - isAnonymous()
      - pattern: /backchannel-logout
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /auth/login-failed
        access:
          - isAnonymous()
      - pattern: /auth/th-version
        access:
          - isAnonymous()
      - pattern: /auth/me
        access:
          - isAuthenticated()
      - pattern: /auth/brand
        access:
          - isAuthenticated()
      - pattern: /auth/verify
        access:
          - isAuthenticated()

endpoints:
  health:
    enabled: true
    sensitive: false

app:
  source: ${APP_SOURCE:token-handler}
  # MULTI-TENANT requirement map: host -> per-domain gate, resolved by the request
  # Host in /auth/verify (SubdomainAuthorizer + SubdomainRequirements). nginx
  # forwards the original client host as X-Forwarded-Host on the auth_request
  # subrequest. Adding a domain = one entry here (+ its host on demo-shared-client).
  # In K8s this block is supplied by a mounted ConfigMap, so adding a domain is a
  # config edit + rolling restart — no image rebuild, no data-BFF redeploy.
  tenants:
    custodian:
      host: custodian.geowealth.int
      type: resource
      object-type: 59
      permission: 5
    portfolio:
      host: portfolio.geowealth.int
      type: resource
      object-type: 59
      permission: 5
    billing:
      host: billing.geowealth.int
      type: resource          # shared resource → capability gate (authz-service)
      object-type: 59         # BILLING_CENTER
      permission: 5           # EXECUTE
    trading:
      host: trading.geowealth.int
      type: resource
      object-type: 5          # TRADE
      permission: 5           # EXECUTE
  # P1's BrandingApiServlet is now the source of truth for whitelabel data
  # (see BrandingApiClient + BrandResolver). The inline app.brands.* block
  # below is the offline / unit-test fallback used when token is unset.
  branding:
    token: ${POC_BRANDING_API_TOKEN:}
    base-path: /branding-api/keycloak/whitelabel
  # Whitelabel brand catalog — fallback when the Branding API is disabled.
  # Mapping firm-cd → wlcode below mirrors WHITELABEL_TBL.firmCd, but is
  # superseded by an upstream lookup whenever POC_BRANDING_API_TOKEN is set.
  # To add an offline-only firm: append to firm-to-wlcode + one block under
  # brands (or reuse an existing wlcode). For a real firm, just configure it
  # in P1 — no demo edit needed.
  default-wlcode: geowealth
  asset-base: ""             # blank → upstream asset URLs returned verbatim
  cache-ttl-millis: 60000
  firm-to-wlcode:
    "1000009": cca       # CreativeOne PoC user (tim1)
  brands:
    geowealth:
      display-name: GeoWealth
      logo-url: /brand-assets/geowealth/logo.svg
      favicon-url: /brand-assets/geowealth/favicon.ico
      css-vars:
        "--accent": "#307492"
        "--theme-link-color": "#1d6f8a"
        "--theme-gradient-start": "#307492"
        "--theme-gradient-end": "#1d6f8a"
    cca:
      display-name: Creative One Wealth
      logo-url: /brand-assets/cca/logo.svg
      favicon-url: /brand-assets/cca/favicon.ico
      css-vars:
        "--accent": "#d04a02"
        "--theme-link-color": "#a83a02"
        "--theme-gradient-start": "#d04a02"
        "--theme-gradient-end": "#7d2300"
  # Single-tenant fallback (per-domain build): inert while app.tenants is set, so
  # the bean stays empty here (no type → SubdomainAuthorizer uses the host map).
  p1:
    # Browser-facing P1 IdP-initiated SLO endpoint the /auth/logout 303 sends the
    # user to. MUST be reachable by the BROWSER (not the in-cluster Service DNS):
    # logout is a top-level navigation, so an in-cluster host like p1-tomcat:8080
    # would resolve to nothing in the user's browser. The default below targets
    # the compose stack (P1 published on localhost:8888); a K8s deployment, where
    # the browser reaches P1 on a different host/port, MUST override it via the
    # APP_P1_INITIATE_SLO_URL env var — Micronaut relaxed-binds it to this property
    # automatically. (A ${...:default} placeholder can't be used here: Micronaut
    # mis-parses the colons in an http://host:port default.)
    initiate-slo-url: http://localhost:8888/oidc/logout.do
  authz:
    fine-enabled: ${AUTHZ_FINE_ENABLED:false}
    cache-ttl-millis: ${AUTHZ_CACHE_TTL_MILLIS:60000}
