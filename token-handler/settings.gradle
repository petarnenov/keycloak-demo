rootProject.name = 'token-handler'

// Composite build: pull the thin `demo.bff:domain-sdk` (AuthClaims + the
// PolicyRule client the auth code calls) from the sibling source tree — same
// mechanism the domain BFFs use. The auth/session/logout code itself now lives in
// this module's own src (it was the only consumer of that half). At repo-split
// this line becomes a registry dependency; the coordinate (demo.bff:domain-sdk)
// stays the same.
includeBuild('../domain-sdk')
