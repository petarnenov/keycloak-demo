# Domain topology. Postgres + Keycloak are the shared identity tier;
# each domain owns its own FE + BFF image and resolves to its own
# hostname. Domains never share code — only the realm and the SAML
# federation to P1.
#
# Public host ports:
#   auth.geowealth.int:5180   — nginx → keycloak:8080 (TLS terminator)
#   billing.geowealth.int:5184 — nginx → SPA + /api/billing → bff-billing
#   trading.geowealth.int:5185 — nginx → SPA + /api/trading → bff-trading
#
# Internal only (no host port):
#   keycloak:8080, bff-billing:8080, bff-trading:8080, postgres:5432
#
# Login flow: SPA's keycloak-js redirects the browser to
# https://auth.geowealth.int:5180/realms/demo-realm/...&kc_idp_hint=p1 →
# Keycloak emits SAML AuthnRequest to P1 (http://localhost:8080 in dev) →
# P1 POSTs signed Response back through the browser to the auth domain →
# Keycloak first-broker-login → OIDC code → browser back to SPA →
# keycloak-js exchanges code for token → SPA renders dashboard.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--verbose"]
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak runs HTTP internally on 8080; the `auth` nginx in front
      # terminates TLS. KC_HOSTNAME is the public URL clients hit, so token
      # issuer claims and broker callback URIs are generated correctly.
      # KC_PROXY_HEADERS=xforwarded tells Keycloak to trust the X-Forwarded-*
      # headers that nginx sets.
      KC_HOSTNAME: https://auth.geowealth.int:5180
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data
    networks:
      - keycloak-network
    # No host port mapping — Keycloak is reached via the `auth` reverse-proxy
    # service at https://auth.geowealth.int:5180.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ---- auth: TLS reverse-proxy in front of Keycloak --------------------------
  # Gives Keycloak its own hostname (auth.geowealth.int) and HTTPS, mirroring
  # what `sso.acme.com` would be in production. Replaces the previous
  # `keycloak:8898` direct host-port mapping. See `production-topology.md`.
  auth:
    image: nginx:1.27-alpine
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5180:5180"
    volumes:
      - ./keycloak/nginx-auth.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs/auth.geowealth.int.crt:/certs/auth.crt:ro
      - ./proxy/certs/auth.geowealth.int.key:/certs/auth.key:ro

  # ---- domain: billing -------------------------------------------------------
  # Self-contained under ./domains/billing/. FE at billing.geowealth.int:5184
  # (mkcert TLS, /etc/hosts entry required). BFF on :8084 returns stub
  # invoices/summary/usage. Reached from P1/Integrations → Demo Billing.

  demo-billing:
    build:
      context: ./domains/billing/web
    image: keycloak-demo-billing-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5184:5184"
    extra_hosts:
      # nginx proxies /assistant/* to the RAG AI-assistant backend, which runs
      # in a SEPARATE compose project published on the host at :8080. This maps
      # host.docker.internal → the host gateway so nginx can reach it.
      - "host.docker.internal:host-gateway"
    volumes:
      # nginx reads the certs at the same paths its config hardcodes.
      - ./proxy/certs/billing.geowealth.int.crt:/certs/billing.crt:ro
      - ./proxy/certs/billing.geowealth.int.key:/certs/billing.key:ro

  # Internal-only. nginx in the demo-billing container reaches it as
  # bff-billing:8080 via the docker network; no host port mapping.
  bff-billing:
    build:
      # Context is the repo root so the Dockerfile can COPY the shared bff-core
      # source alongside this domain (composite build). See the Dockerfile.
      context: .
      dockerfile: domains/billing/bff/Dockerfile
    image: keycloak-demo-billing-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      MICRONAUT_APPLICATION_NAME: billing-bff
      APP_SOURCE: billing-bff
      # Subdomain requirement: billing is a SHARED RESOURCE → access is decided by
      # the CURRENT logged-in user's fine permission (Tier 2/3 via P1), not firm
      # membership. Default gate = BILLING_CENTER (59) + EXECUTE (5).
      APP_REQUIREMENT_TYPE: "${BILLING_REQUIREMENT_TYPE:-resource}"
      APP_REQUIREMENT_OBJECT_TYPE: "${BILLING_REQUIREMENT_OBJECT_TYPE:-59}"
      APP_REQUIREMENT_PERMISSION: "${BILLING_REQUIREMENT_PERMISSION:-5}"
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm
      # BFF / Token Handler: the BFF is a confidential OIDC client doing the
      # code flow server-side. It reaches Keycloak at the PUBLIC issuer (so the
      # `iss` claim matches the browser-side authorize redirect) via the
      # auth.geowealth.int:host-gateway extra_host below; TLS to the mkcert cert
      # is trusted insecurely for the demo (application.yml).
      OAUTH_CLIENT_ID: demo-billing-client
      OAUTH_CLIENT_SECRET: "${BILLING_OAUTH_CLIENT_SECRET}"
      KEYCLOAK_ISSUER: https://auth.geowealth.int:5180/realms/demo-realm
      # Tier 2/3 fine authz (p1-auth-flow.md §2.2/§2.9). ON for billing because it
      # is now a shared-resource subdomain — the SubdomainRequirementFilter must
      # call P1 to check the logged-in user's (object-type, permission). P1_AUTHZ_URL
      # points at the host geowealth Tomcat (P1 on :8888); host.docker.internal
      # resolves to the host via the extra_hosts host-gateway mapping below.
      AUTHZ_FINE_ENABLED: "${AUTHZ_FINE_ENABLED:-true}"
      P1_AUTHZ_URL: "${P1_AUTHZ_URL:-http://host.docker.internal:8888}"
    extra_hosts:
      - "auth.geowealth.int:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      # mkcert root CA — imported into the JRE trust store at startup so the BFF
      # trusts Keycloak's mkcert cert for the server-side OIDC code exchange.
      - ./proxy/certs/mkcert-rootCA.pem:/certs/mkcert-rootCA.pem:ro

  # ---- domain: trading -------------------------------------------------------
  # Twin of billing — same shape, different stub data (positions, orders, P/L).
  # FE at trading.geowealth.int:5185 (mkcert TLS, /etc/hosts entry required).
  # BFF is internal-only, reached by nginx as bff-trading:8080. Same as billing.

  demo-trading:
    build:
      context: ./domains/trading/web
    image: keycloak-demo-trading-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5185:5185"
    volumes:
      - ./proxy/certs/trading.geowealth.int.crt:/certs/trading.crt:ro
      - ./proxy/certs/trading.geowealth.int.key:/certs/trading.key:ro

  bff-trading:
    build:
      # Context is the repo root so the Dockerfile can COPY the shared bff-core
      # source alongside this domain (composite build). See the Dockerfile.
      context: .
      dockerfile: domains/trading/bff/Dockerfile
    image: keycloak-demo-trading-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      MICRONAUT_APPLICATION_NAME: trading-bff
      APP_SOURCE: trading-bff
      # Subdomain requirement: trading is a SHARED RESOURCE → access is decided by
      # the CURRENT logged-in user's fine permission (Tier 2/3 via P1), not firm
      # membership. Default gate = TRADE (5) + EXECUTE (5).
      APP_REQUIREMENT_TYPE: "${TRADING_REQUIREMENT_TYPE:-resource}"
      APP_REQUIREMENT_OBJECT_TYPE: "${TRADING_REQUIREMENT_OBJECT_TYPE:-5}"
      APP_REQUIREMENT_PERMISSION: "${TRADING_REQUIREMENT_PERMISSION:-5}"
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm
      # BFF / Token Handler — confidential OIDC client; reaches KC at the public
      # issuer via the auth.geowealth.int:host-gateway extra_host (see billing).
      OAUTH_CLIENT_ID: demo-trading-client
      OAUTH_CLIENT_SECRET: "${TRADING_OAUTH_CLIENT_SECRET}"
      KEYCLOAK_ISSUER: https://auth.geowealth.int:5180/realms/demo-realm
      # Tier 2/3 fine authz — ON because trading is now a shared-resource subdomain
      # (the SubdomainRequirementFilter calls P1 to check the logged-in user's
      # (object-type, permission)). P1 on :8888 via the host-gateway extra_host.
      AUTHZ_FINE_ENABLED: "${AUTHZ_FINE_ENABLED:-true}"
      P1_AUTHZ_URL: "${P1_AUTHZ_URL:-http://host.docker.internal:8888}"
    extra_hosts:
      - "auth.geowealth.int:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxy/certs/mkcert-rootCA.pem:/certs/mkcert-rootCA.pem:ro

volumes:
  postgres_data:
  keycloak_data:

networks:
  keycloak-network:
    driver: bridge
