# Domain topology. The realm + identity tier (postgres + keycloak +
# user-service) is shared; each domain owns its own FE + BFF image and
# resolves to its own hostname. Domains never share code — only the realm
# and the identity-provider federation (SAML to P1).
#
#   browser → P1/Integrations sidebar (in the ~/geowealth Tomcat app)
#                ├─ Demo Billing  → https://billing.geowealth.int:5184  (→ bff-billing:8084)
#                └─ Demo Trading  → https://trading.geowealth.int:5185  (→ bff-trading:8085)
#
# Each link first hits Keycloak's authorize endpoint with kc_idp_hint=p1,
# which short-circuits straight to P1's SAML IdP and back. Once Keycloak
# emits the OIDC code, the browser lands on the domain SPA, which runs
# keycloak-js to finalize and pull a token.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    command: ["start-dev", "--import-realm", "--verbose"]
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      KC_OPTS: "-Xmx2g"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      RESEND_API_TOKEN: "${RESEND_API_TOKEN}"
      RESEND_FROM: "Demo Realm <onboarding@resend.dev>"
      OTP_TRUST_WINDOW_MINUTES: "60"
      USER_SERVICE_URL: http://user-service:8080
      # POC: GeoWealth white-labeling sync. The LoginFormsProvider override
      # in geowealth-keycloak/ reads these at SPI init time and constructs
      # the BrandingApiClient. If either URL or TOKEN is blank, the provider
      # falls through to the hardcoded BrandRegistry fallback — useful when
      # the geowealth Tomcat isn't running yet. host.docker.internal resolves
      # to the dev machine's loopback on Docker Desktop / Podman (macOS).
      # On Linux, add `extra_hosts: ["host.docker.internal:host-gateway"]`.
      KC_SPI_LOGIN_FREEMARKER_GEOWEALTH_BRANDING_API_URL: "${POC_BRANDING_API_URL:-http://host.docker.internal:8080}"
      KC_SPI_LOGIN_FREEMARKER_GEOWEALTH_BRANDING_API_TOKEN: "${POC_BRANDING_API_TOKEN}"
      KC_SPI_LOGIN_FREEMARKER_GEOWEALTH_BRANDING_CACHE_TTL_SECONDS: "60"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      # POC: white-labeling realm imported alongside the demo realm. Both go
      # through Keycloak's --import-realm sweep; IGNORE_EXISTING means the
      # geowealth-realm is only created on first run (fresh DB) or after
      # `down -v`. To edit a running realm, use the admin API.
      - ./keycloak/geowealth-realm-export.json:/opt/keycloak/data/import/geowealth-realm.json
      - keycloak_data:/opt/keycloak/data
    networks:
      - keycloak-network
    ports:
      - "8898:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: keycloak-demo-user-service:latest
    environment:
      MICRONAUT_APPLICATION_NAME: user-service
    networks:
      - keycloak-network
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---- domain: billing -------------------------------------------------------
  # Self-contained under ./domains/billing/. FE at billing.geowealth.int:5184
  # (mkcert TLS, /etc/hosts entry required). BFF on :8084 returns stub
  # invoices/summary/usage. Reached from P1/Integrations → Demo Billing.

  demo-billing:
    build:
      context: ./domains/billing/web
    image: keycloak-demo-billing-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5184:5184"
    volumes:
      - ./proxy/certs/billing.geowealth.int.crt:/certs/billing.crt:ro
      - ./proxy/certs/billing.geowealth.int.key:/certs/billing.key:ro
    environment:
      BFF_BILLING_URL: http://bff-billing:8080
      HTTPS_CERT_PATH: /certs/billing.crt
      HTTPS_KEY_PATH: /certs/billing.key

  bff-billing:
    build:
      context: ./domains/billing/bff
    image: keycloak-demo-billing-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8084:8080"
    environment:
      MICRONAUT_APPLICATION_NAME: billing-bff
      APP_SOURCE: billing-bff
      CORS_ORIGIN: https://billing.geowealth.int:5184
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm

  # ---- domain: trading -------------------------------------------------------
  # Twin of billing — same shape, different stub data (positions, orders, P/L).
  # FE at trading.geowealth.int:5185 (mkcert TLS, /etc/hosts entry required).
  # BFF on :8085. Reached from P1/Integrations → Demo Trading.

  demo-trading:
    build:
      context: ./domains/trading/web
    image: keycloak-demo-trading-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5185:5185"
    volumes:
      - ./proxy/certs/trading.geowealth.int.crt:/certs/trading.crt:ro
      - ./proxy/certs/trading.geowealth.int.key:/certs/trading.key:ro
    environment:
      BFF_TRADING_URL: http://bff-trading:8080
      HTTPS_CERT_PATH: /certs/trading.crt
      HTTPS_KEY_PATH: /certs/trading.key

  bff-trading:
    build:
      context: ./domains/trading/bff
    image: keycloak-demo-trading-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      MICRONAUT_APPLICATION_NAME: trading-bff
      APP_SOURCE: trading-bff
      CORS_ORIGIN: https://trading.geowealth.int:5185
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm

volumes:
  postgres_data:
  keycloak_data:

networks:
  keycloak-network:
    driver: bridge
