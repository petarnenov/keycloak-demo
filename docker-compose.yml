# Domain topology. Postgres + Keycloak are the shared identity tier;
# each domain owns its own FE + BFF image and resolves to its own
# hostname. Domains never share code — only the realm and the SAML
# federation to P1.
#
# Public host ports:
#   auth.geowealth.int:5180   — nginx → keycloak:8080 (TLS terminator)
#   billing.geowealth.int:5184 — nginx → SPA + /api/billing → bff-billing
#   trading.geowealth.int:5185 — nginx → SPA + /api/trading → bff-trading
#
# Internal only (no host port):
#   keycloak:8080, bff-billing:8080, bff-trading:8080, postgres:5432
#
# Login flow: SPA's keycloak-js redirects the browser to
# https://auth.geowealth.int:5180/realms/demo-realm/...&kc_idp_hint=p1 →
# Keycloak emits SAML AuthnRequest to P1 (http://localhost:8080 in dev) →
# P1 POSTs signed Response back through the browser to the auth domain →
# Keycloak first-broker-login → OIDC code → browser back to SPA →
# keycloak-js exchanges code for token → SPA renders dashboard.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--verbose"]
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Keycloak runs HTTP internally on 8080; the `auth` nginx in front
      # terminates TLS. KC_HOSTNAME is the public URL clients hit, so token
      # issuer claims and broker callback URIs are generated correctly.
      # KC_PROXY_HEADERS=xforwarded tells Keycloak to trust the X-Forwarded-*
      # headers that nginx sets.
      KC_HOSTNAME: https://auth.geowealth.int:5180
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data
    networks:
      - keycloak-network
    # No host port mapping — Keycloak is reached via the `auth` reverse-proxy
    # service at https://auth.geowealth.int:5180.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # ---- auth: TLS reverse-proxy in front of Keycloak --------------------------
  # Gives Keycloak its own hostname (auth.geowealth.int) and HTTPS, mirroring
  # what `sso.acme.com` would be in production. Replaces the previous
  # `keycloak:8898` direct host-port mapping. See `production-topology.md`.
  auth:
    image: nginx:1.27-alpine
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5180:5180"
    volumes:
      - ./keycloak/nginx-auth.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs/auth.geowealth.int.crt:/certs/auth.crt:ro
      - ./proxy/certs/auth.geowealth.int.key:/certs/auth.key:ro

  # ---- domain: billing -------------------------------------------------------
  # Self-contained under ./domains/billing/. FE at billing.geowealth.int:5184
  # (mkcert TLS, /etc/hosts entry required). BFF on :8084 returns stub
  # invoices/summary/usage. Reached from P1/Integrations → Demo Billing.

  demo-billing:
    build:
      context: ./domains/billing/web
    image: keycloak-demo-billing-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5184:5184"
    volumes:
      # nginx reads the certs at the same paths its config hardcodes.
      - ./proxy/certs/billing.geowealth.int.crt:/certs/billing.crt:ro
      - ./proxy/certs/billing.geowealth.int.key:/certs/billing.key:ro

  # Internal-only. nginx in the demo-billing container reaches it as
  # bff-billing:8080 via the docker network; no host port mapping.
  bff-billing:
    build:
      context: ./domains/billing/bff
    image: keycloak-demo-billing-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      MICRONAUT_APPLICATION_NAME: billing-bff
      APP_SOURCE: billing-bff
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm

  # ---- domain: trading -------------------------------------------------------
  # Twin of billing — same shape, different stub data (positions, orders, P/L).
  # FE at trading.geowealth.int:5185 (mkcert TLS, /etc/hosts entry required).
  # BFF is internal-only, reached by nginx as bff-trading:8080. Same as billing.

  demo-trading:
    build:
      context: ./domains/trading/web
    image: keycloak-demo-trading-web:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "5185:5185"
    volumes:
      - ./proxy/certs/trading.geowealth.int.crt:/certs/trading.crt:ro
      - ./proxy/certs/trading.geowealth.int.key:/certs/trading.key:ro

  bff-trading:
    build:
      context: ./domains/trading/bff
    image: keycloak-demo-trading-bff:latest
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      MICRONAUT_APPLICATION_NAME: trading-bff
      APP_SOURCE: trading-bff
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080/realms/demo-realm

volumes:
  postgres_data:
  keycloak_data:

networks:
  keycloak-network:
    driver: bridge
